- name: cell-26
  type: code
  source: "#@title D9) detectron2 source build — final attempt (async) { run: \"auto\" }\n# Force correct\
    \ CUDA arch + use our torch via --no-build-isolation. A100 = sm_80.\n# Pre-install build deps explicitly\
    \ to avoid pip's isolated env re-resolving.\nimport subprocess, threading, time, textwrap, os\nfrom\
    \ pathlib import Path\n\nscript = textwrap.dedent('''\n    set +e\n    source /usr/local/etc/profile.d/conda.sh\n\
    \    conda activate sabr\n\n    echo \"=== [1] Build deps ===\"\n    pip install --no-cache-dir ninja\
    \ \"setuptools<65\" \"cython<3\" packaging wheel 2>&1 | tail -3\n\n    echo \"=== [2] detectron2 from\
    \ source with our torch ===\"\n    # FORCE_CUDA=1 -> pytorch ext compiles with CUDA. Arch 8.0=A100,\
    \ 9.0=H100 fallback.\n    # --no-build-isolation -> use our torch 2.1 (setup.py can import it)\n \
    \   export FORCE_CUDA=1\n    export TORCH_CUDA_ARCH_LIST=\"8.0\"\n    pip install --no-cache-dir --no-build-isolation\
    \ \\\\\n        'git+https://github.com/facebookresearch/detectron2.git@main' 2>&1 | tail -30\n\n\
    \    echo \"=== [3] Verify ===\"\n    python -c \"import detectron2; print('detectron2:', detectron2.__version__)\"\
    \n    echo \"=== [DONE] ===\"\n''').strip()\nPath('/tmp/d2_build.sh').write_text(script)\nsubprocess.run(['chmod',\
    \ '+x', '/tmp/d2_build.sh'], check=True)\n\n_d2 = {'status': 'running', 'rc': None, 'started_at':\
    \ time.time()}\ndef _run():\n    try:\n        _d2['rc'] = subprocess.run(\n            'bash /tmp/d2_build.sh\
    \ > /tmp/d2_build.log 2>&1', shell=True).returncode\n        _d2['status'] = 'done'\n    except Exception\
    \ as e:\n        _d2['status'] = 'error'; _d2['err'] = str(e)\nthreading.Thread(target=_run, daemon=True).start()\n\
    print(\"detectron2 build launched bg. ~5-10 min. Poll /tmp/d2_build.log\")"
