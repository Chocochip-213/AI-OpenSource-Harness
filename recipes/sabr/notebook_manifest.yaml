- name: cell-19
  type: code
  source: "#@title H) Run SABR inference (--skipContext, async) { run: \"auto\" }\n# `mamba run -n sabr`\
    \ activates the env for all subprocess children (PHALP demo.py etc).\n# MPLBACKEND=Agg avoids matplotlib\
    \ inline backend crash in ultralytics.\n# PYOPENGL_PLATFORM=osmesa for pyrender headless GL.\n# Launch\
    \ async (5-15 min expected) so MCP doesn't timeout.\nimport os, subprocess, threading, time\nfrom\
    \ pathlib import Path\n\nos.chdir('/root/virtual-avatar-generation')\n# Clean previous run's output\
    \ dir (idempotent)\nout_dir = Path('output')\nout_dir.mkdir(parents=True, exist_ok=True)\n\nenv =\
    \ os.environ.copy()\nenv['HOME'] = '/root'\nenv['MPLBACKEND'] = 'Agg'\nenv['PYOPENGL_PLATFORM'] =\
    \ 'osmesa'\n\n_inf = {'status': 'running', 'rc': None, 'started_at': time.time()}\ndef _run_infer():\n\
    \    try:\n        _inf['rc'] = subprocess.run(\n            ['mamba', 'run', '-n', 'sabr', '--no-capture-output',\n\
    \             'python', '-u', 'inference.py',\n             '--ckpt', '0070000.pt',\n            \
    \ '--mode', '0',\n             '--skipContext',\n             '--videoDir', 'videos'],\n         \
    \   cwd='/root/virtual-avatar-generation',\n            env=env,\n            stdout=open('/tmp/sabr_inf.log',\
    \ 'w'),\n            stderr=subprocess.STDOUT).returncode\n        _inf['status'] = 'done'\n    except\
    \ Exception as e:\n        _inf['status'] = 'error'\n        _inf['err'] = str(e)\n\nthreading.Thread(target=_run_infer,\
    \ daemon=True).start()\nprint(\"  Inference launched (thread). Log: /tmp/sabr_inf.log\")\nprint(\"\
    \  Expected 5-15 min for a 10s clip. Poll with H-poll cell.\")"
