  type: code
  source: "#@title D8) Fix video filename + try detectron2 pre-built wheel { run: \"auto\" }\n# Issue\
    \ 1: inference.py main() does f\"{video_name}.mp4\" but video_name from os.listdir\n# already includes\
    \ .mp4 — double extension. Rename uploaded files to strip .mp4.\n# Issue 2: detectron2 needed by video_inpainting.py.\
    \ Source build fails on Colab.\n# Try pre-built wheel for torch 2.1 + cu121.\nimport os, subprocess\n\
    from pathlib import Path\n\n# [1] Rename videos: video.mp4 -> video (no extension). inference.py:main()\
    \ appends .mp4.\nvideos = Path('/root/virtual-avatar-generation/videos')\nfor v in list(videos.iterdir()):\n\
    \    if v.is_file() and v.suffix == '.mp4':\n        # Move to stem name (no extension). inference.py\
    \ will append .mp4 and find it.\n        # Actually NO — inference.py does f\"{name}.mp4\" so we need\
    \ the file to LITERALLY\n        # be named `{stem}.mp4` when listdir returns `{stem}` AND {stem}.mp4\
    \ is the file.\n        # Simpler: leave files as is, PATCH inference.py:main to handle both cases.\n\
    \        pass\n\n# Patch inference.py:main to strip .mp4 from video_name if present\ninf_py = Path('/root/virtual-avatar-generation/inference.py')\n\
    src = inf_py.read_text()\nbad_main = \"    for video_name in os.listdir(videoDir):\"\ngood_main =\
    \ \"    for video_name in os.listdir(videoDir):\\n        if video_name.lower().endswith('.mp4'):\\\
    n            video_name = video_name[:-4]\"\nif \"video_name[:-4]\" not in src:\n    assert bad_main\
