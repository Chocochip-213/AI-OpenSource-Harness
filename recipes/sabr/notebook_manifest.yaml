- name: cell-30
  type: code
  source: "#@title Hp-deep) Phase marker scan { run: \"auto\" }\nimport subprocess\nfrom pathlib import\
    \ Path\nlog = '/tmp/sabr_inf.log'\n# Count lines matching various phase markers\npatterns = [\n  \
    \  ('ffmpeg.*fps=', 'ffmpeg extract'),\n    ('person,', 'YOLO person detect'),\n    ('Loading.*SAM',\
    \ 'SAM load'),\n    ('SamPredictor|sam_model', 'SAM predictor'),\n    ('RAFT|raft', 'RAFT optical\
    \ flow'),\n    ('FGT|fgt', 'FGT inpaint'),\n    ('LAFC|lafc', 'LAFC'),\n    ('PHALP|phalp', 'PHALP\
    \ tracking'),\n    ('HMR|hmr', 'HMR pose'),\n    ('DiT|diffusion', 'DiT diffusion'),\n    ('Renderer|pyrender',\
    \ 'render'),\n    ('Inpainting finished|complete|Done', 'completion'),\n]\nprint(\"=== Phase markers\
    \ in log ===\")\nfor pat, label in patterns:\n    r = subprocess.run(['grep', '-cE', pat, log], capture_output=True,\
    \ text=True)\n    count = r.stdout.strip()\n    print(f\"  {count:>5}  {label}\")\n\n# Show last non-YOLO\
    \ line to see actual progress\nr = subprocess.run(\n    ['bash', '-c', f\"grep -v 'person,' '{log}'\
    \ | grep -v 'Speed:' | grep -v '^$' | tail -20\"],\n    capture_output=True, text=True)\nprint(\"\\\
    n=== Last 20 non-YOLO lines ===\")\nprint(r.stdout)"
