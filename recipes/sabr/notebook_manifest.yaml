    model_output[:, :inpaint.shape[1]\" in src:\n    print(\"\\n  already patched\")\nelse:\n    print(\"\
    \\n  anchor not found\")\n\n# Compile check\nr = subprocess.run(['mamba', 'run', '-n', 'sabr', '--no-capture-output',\n\
