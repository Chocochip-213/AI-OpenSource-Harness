      # NLF Body Embedding API
      Run-all the cells → public endpoint URL printed → leave the last cell running to keep Colab alive.

      **Runtime**: Colab A100 40GB · 2025.07 (or 2026.04 — both verified).
      **Time**: ~3 min cold (clone + 473 MB weight DL + model load + tunnel up).
      **Source**: <https://github.com/isarandi/nlf> pinned `f8611fc7…` (Sárándi+Pons-Moll NeurIPS'24).

      **Final endpoints** (printed by cell I):
      - `POST /embed` (multipart `file`, single image) → 7-dim pose-invariant body-shape vector — **PRIMARY (signup flow)**
      - `POST /infer` → full SMPL params + vector
      - `POST /compare` (multipart `files`, 2+) → pairwise body-shape distance
      - `GET /health`, `GET /docs`

      **Use case**: user-signup flow — call `/embed` once with selfie, store the 7-dim vector
      in your DB, all future similarity computed client-side from stored vectors.

      License: code MIT, model weights non-commercial research use only.

