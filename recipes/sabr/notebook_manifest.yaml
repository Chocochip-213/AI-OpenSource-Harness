title: SABR — Virtual Avatar Generation (Colab A100 40GB)
cells:
- name: cell-0
  type: code
  source: "#@title A) GPU + Disk Preflight { run: \"auto\" }\n# Fail-fast: stop here if we can't finish\
    \ the run.\nimport subprocess, re, shutil, sys\n\nout = subprocess.run(['nvidia-smi', '--query-gpu=name,memory.total',\n\
    \                      '--format=csv,noheader'], capture_output=True, text=True)\nif out.returncode\
    \ != 0:\n    sys.exit(\"FATAL: no GPU detected. Runtime > Change runtime type > A100 GPU.\")\n\ngpu_line\
    \ = out.stdout.strip().splitlines()[0]\nname, mem = [p.strip() for p in gpu_line.split(',')]\nmem_mb\
    \ = int(re.search(r'(\\d+)', mem).group(1))\nmem_gb = mem_mb / 1024\nprint(f\"  GPU: {name}\")\nprint(f\"\
    \  VRAM: {mem_gb:.1f} GB ({mem_mb} MB)\")\n\nif mem_gb < 38:\n    sys.exit(f\"FATAL: need >= 40 GB\
    \ VRAM (have {mem_gb:.1f} GB). \"\n             f\"README FAQ: full pipeline needs 80GB; context-skip\
    \ needs 40GB.\")\n\nif 'A100' not in name and 'H100' not in name:\n    print(f\"  WARN: GPU is {name}.\
    \ Plan targets A100; may work on H100. \"\n          f\"Other GPUs (T4, L4, V100) WILL fail - stop\
    \ now.\")\n\n# Disk check /root (where $HOME points + where weights land)\ntotal, used, free = shutil.disk_usage('/root')\n\
    free_gb = free / (1024**3)\nprint(f\"  Disk free (/root): {free_gb:.1f} GB\")\nif free_gb < 45:\n\
    \    sys.exit(f\"FATAL: need >= 45 GB free on /root (have {free_gb:.1f} GB).\")\n\nprint(f\"  Python:\
    \ {sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}\")\nif sys.version_info\
    \ >= (3, 12):\n    print(f\"  WARN: Python 3.12+ detected. chumpy build may fail.\")\n\nimport torch\n\
    print(f\"  torch: {torch.__version__}\")\nprint(\"\\n[A] PASS - preflight OK, proceeding.\")"
  cell_id: lIYdn1woOS1n
- name: cell-1
  type: code
  source: "#@title B) Clone + HOME setup { run: \"auto\" }\n# inference.py:23-24 hardcodes $HOME/virtual-avatar-generation/.\n\
    import os, subprocess, sys\n\nos.environ['HOME'] = '/root'\nREPO = '/root/virtual-avatar-generation'\n\
    UPSTREAM = 'https://github.com/agent-mitra/virtual-avatar-generation.git'\n\nif os.path.isdir(os.path.join(REPO,\
    \ '.git')):\n    print(f\"  Already cloned at {REPO}. Skipping.\")\nelse:\n    r = subprocess.run(['git',\
    \ 'clone', '--depth', '1', UPSTREAM, REPO],\n                       capture_output=True, text=True)\n\
    \    if r.returncode != 0:\n        sys.exit(f\"FATAL: git clone failed:\\n{r.stderr}\")\n    print(f\"\
    \  Cloned -> {REPO}\")\n\nos.chdir(REPO)\nprint(f\"  cwd: {os.getcwd()}\")\nr = subprocess.run(['git',\
    \ 'rev-parse', '--short', 'HEAD'],\n                   capture_output=True, text=True)\nprint(f\"\
    \  HEAD: {r.stdout.strip()}  (pin this in recipe.yaml after first success)\")\n\n# List top-level\
    \ files so we know the clone is complete\nr = subprocess.run(['ls', '-la'], capture_output=True, text=True)\n\
    print(\"\\n  Top-level files:\")\nprint('\\n'.join('    ' + line for line in r.stdout.splitlines()[:15]))\n\
    \nprint(\"\\n[B] PASS - repo ready at\", REPO)"
  cell_id: iEemGRB4IX1C
- name: cell-2
  type: code
  source: "#@title C1) Direct HTTP weight downloads (15 GB, 17 files) { run: \"auto\" }\n# Bulk: 0070000.pt\
    \ (8.94 GB) + DINOv2 + SAM + YOLO + SMPL + DWPose + GroundingDINO\n# + PHALP (UT Austin) + FGT/LAFC.\
    \ Idempotent: skips files with matching size.\nimport os, subprocess, sys, time\nfrom pathlib import\
    \ Path\n\nREPO = Path('/root/virtual-avatar-generation')\nos.chdir(REPO)\n\nfor d in [\n    'pipeline/track/data',\n\
    \    'pipeline/track/phalp/trackers',\n    'pipeline/context/dwpose',\n    'pipeline/context/ckpt',\n\
    \    'pipeline/context/aot/pretrain_models',\n    'pipeline/context/phalp_weights/3D',\n    'pipeline/environment/FGT/checkpoint',\n\
    \    'pipeline/environment/FGT/flowCheckPoint',\n    'pipeline/environment/LAFC/checkpoint',\n   \
    \ 'pipeline/environment/weight',\n    'pipeline/environment/tool/tool',\n    'model/backbones',\n\
    ]:\n    (REPO / d).mkdir(parents=True, exist_ok=True)\n\nWEIGHTS = [\n    ('0070000.pt',\n     'https://pub-29afd72dc81d490fa2746896005a9d8b.r2.dev/0070000.pt',\
    \ 8938024765),\n    ('model/backbones/dinov2_vit_large.pth',\n     'https://dl.fbaipublicfiles.com/dinov2/dinov2_vitl14/dinov2_vitl14_reg4_pretrain.pth',\
    \ 1217607321),\n    ('model/backbones/dinov2_vit_base.pth',\n     'https://dl.fbaipublicfiles.com/dinov2/dinov2_vitb14/dinov2_vitb14_reg4_pretrain.pth',\
    \ 346393545),\n    ('pipeline/track/phalp/trackers/sam_vit_h_4b8939.pth',\n     'https://dl.fbaipublicfiles.com/segment_anything/sam_vit_h_4b8939.pth',\
    \ 2564550879),\n    ('pipeline/track/phalp/trackers/yolov8l-seg.pt',\n     'https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8l-seg.pt',\
    \ 92391859),\n    ('pipeline/track/data/basicModel_neutral_lbs_10_207_0_v1.0.0.pkl',\n     'https://huggingface.co/spaces/brjathu/HMR2.0/resolve/e5201da358ccbc04f4a5c4450a302fcb9de571dd/data/smpl/basicModel_neutral_lbs_10_207_0_v1.0.0.pkl',\
    \ 39001280),\n    ('pipeline/context/dwpose/dw-ll_ucoco_384.onnx',\n     'https://huggingface.co/yzd-v/DWPose/resolve/main/dw-ll_ucoco_384.onnx',\
    \ 134399116),\n    ('pipeline/context/ckpt/groundingdino_swint_ogc.pth',\n     'https://huggingface.co/ShilongLiu/GroundingDINO/resolve/main/groundingdino_swint_ogc.pth',\
    \ 693997677),\n    ('pipeline/context/phalp_weights/hmar_v2_weights.pth',\n     'https://www.cs.utexas.edu/~pavlakos/phalp/weights/hmar_v2_weights.pth',\
    \ 174619425),\n    ('pipeline/context/phalp_weights/pose_predictor_40006.ckpt',\n     'https://www.cs.utexas.edu/~pavlakos/phalp/weights/pose_predictor_40006.ckpt',\
    \ 146596833),\n    ('pipeline/context/phalp_weights/config_40006.yaml',\n     'https://www.cs.utexas.edu/~pavlakos/phalp/weights/config_40006.yaml',\
    \ 5820),\n    ('pipeline/environment/FGT/checkpoint/fgt.pth.tar',\n     'https://huggingface.co/hitachinsk/FGT/resolve/main/fgt.pth.tar',\
    \ 157341393),\n    ('pipeline/environment/FGT/checkpoint/FGT_config.yaml',\n     'https://huggingface.co/hitachinsk/FGT/resolve/main/FGT_config.yaml',\
    \ 413),\n    ('pipeline/environment/LAFC/checkpoint/lafc.pth.tar',\n     'https://huggingface.co/hitachinsk/FGT/resolve/main/lafc.pth.tar',\
    \ 12360405),\n    ('pipeline/environment/LAFC/checkpoint/LAFC_config.yaml',\n     'https://huggingface.co/hitachinsk/FGT/resolve/main/LAFC_config.yaml',\
    \ 152),\n    ('pipeline/environment/FGT/flowCheckPoint/lafc_single.pth.tar',\n     'https://huggingface.co/hitachinsk/FGT/resolve/main/lafc_single.pth.tar',\
    \ 11547053),\n    ('pipeline/environment/FGT/flowCheckPoint/LAFC_single_config.yaml',\n     'https://huggingface.co/hitachinsk/FGT/resolve/main/LAFC_single_config.yaml',\
    \ 160),\n]\n\ndef download(url, dst, expected_bytes, retries=3):\n    dst = Path(dst)\n    if dst.exists()\
    \ and dst.stat().st_size == expected_bytes:\n        print(f\"  skip: {dst.name}\", flush=True)\n\
    \        return\n    if dst.exists():\n        print(f\"  re-download (size {dst.stat().st_size} vs\
    \ {expected_bytes}): {dst.name}\", flush=True)\n    dst.parent.mkdir(parents=True, exist_ok=True)\n\
    \    for attempt in range(1, retries + 1):\n        t0 = time.time()\n        r = subprocess.run(\n\
    \            ['curl', '-L', '-C', '-', '-fSL', '-o', str(dst), url],\n            capture_output=True,\
    \ text=True)\n        dt = time.time() - t0\n        if r.returncode == 0 and dst.exists() and dst.stat().st_size\
    \ == expected_bytes:\n            mb = dst.stat().st_size / (1024**2)\n            print(f\"  OK:\
    \   {dst.name} ({mb:.1f} MB in {dt:.1f}s = {mb/dt:.1f} MB/s)\", flush=True)\n            return\n\
    \        print(f\"  retry {attempt}/{retries}: {dst.name} \"\n              f\"({dst.stat().st_size\
    \ if dst.exists() else 0} / {expected_bytes})\", flush=True)\n    sys.exit(f\"FATAL: download failed\
    \ after {retries} retries: {url}\")\n\nprint(f\"=== Downloading {len(WEIGHTS)} files (~15 GB total)\
    \ ===\", flush=True)\nt_start = time.time()\nfor dst, url, size in WEIGHTS:\n    download(url, REPO\
    \ / dst, size)\ntotal_min = (time.time() - t_start) / 60\nprint(f\"\\n[C1] PASS - all {len(WEIGHTS)}\
    \ files. Total wall time: {total_min:.1f} min\")"
  cell_id: Av8sthexIrbB
- name: cell-3
  type: code
  source: "#@title C2) GDrive + PHALP 3D + RAFT + duplicates { run: \"auto\" }\n# Smaller files: 3 AOT/DeAOT\
    \ (gdown with retry) + 5 PHALP 3D aux + 1 RAFT zip (2 copies)\n# + 1 YOLO duplicate + 1 generated\
    \ zero_vector.\nimport os, subprocess, sys, time, pickle, numpy as np\nfrom pathlib import Path\n\n\
    REPO = Path('/root/virtual-avatar-generation')\nos.chdir(REPO)\n\n# Install gdown 4.6+ (handles virus-scan\
    \ warning auto)\nsubprocess.run(['pip', '-q', 'install', 'gdown>=4.6'], check=True)\n\n# GDrive AOT\
    \ / DeAOT with retry + direct-URL fallback\nGDOWN_FILES = [\n    ('pipeline/context/ckpt/R50_DeAOTL_PRE_YTB_DAV.pth',\n\
    \     '1QoChMkTVxdYZ_eBlZhK2acq9KMQZccPJ', 236513959),\n    ('pipeline/context/ckpt/DeAOTB_PRE_YTB_DAV.pth',\n\
    \     '1BHxsonnvJXylqHlZ1zJHHc-ymKyq-CFf', 158464770),\n    ('pipeline/context/aot/pretrain_models/R50_AOTL_PRE_YTB_DAV.pth',\n\
    \     '1qJDYn3Ibpquu4ffYoQmVjg1YCbr2JQep', 60012304),\n]\n\nprint(\"=== GDrive (AOT/DeAOT) ===\",\
    \ flush=True)\nfor dst_rel, gid, size in GDOWN_FILES:\n    dst = REPO / dst_rel\n    if dst.exists()\
    \ and dst.stat().st_size == size:\n        print(f\"  skip: {dst.name}\", flush=True); continue\n\
    \    dst.parent.mkdir(parents=True, exist_ok=True)\n    ok = False\n    for attempt in range(1, 4):\n\
    \        if attempt <= 2:\n            r = subprocess.run(['gdown', gid, '-O', str(dst), '--fuzzy'],\n\
    \                               capture_output=True, text=True)\n        else:\n            url =\
    \ f'https://drive.usercontent.google.com/download?id={gid}&confirm=t'\n            r = subprocess.run(['curl',\
    \ '-L', '-fSL', '-o', str(dst), url],\n                               capture_output=True, text=True)\n\
    \        if r.returncode == 0 and dst.exists() and dst.stat().st_size == size:\n            print(f\"\
    \  OK:   {dst.name} ({dst.stat().st_size / (1024**2):.1f} MB) [attempt {attempt}]\", flush=True)\n\
    \            ok = True; break\n        print(f\"  retry {attempt}/3 {gid}: got {dst.stat().st_size\
    \ if dst.exists() else 0} / {size}\", flush=True)\n        time.sleep(5 * attempt)\n    if not ok:\n\
    \        print(f\"  stderr tail: {r.stderr[-500:] if r.stderr else '(none)'}\")\n        sys.exit(f\"\
    FATAL: GDrive failed for {gid}\")\n\n# PHALP 3D aux files (UT Austin, 5 small)\nprint(\"\\n=== PHALP\
    \ 3D aux (UT Austin) ===\", flush=True)\nPHALP_3D = [\n    ('SMPL_to_J19.pkl', 1047441),\n    ('texture.npz',\
    \ 617898),\n    ('head_faces.npy', 39680),\n    ('smpl_mean_params.npz', 1998),\n    ('mean_std.npy',\
    \ 1936),\n]\nfor fname, size in PHALP_3D:\n    dst = REPO / 'pipeline/context/phalp_weights/3D' /\
    \ fname\n    if dst.exists() and dst.stat().st_size == size:\n        print(f\"  skip: {fname}\",\
    \ flush=True); continue\n    url = f'https://www.cs.utexas.edu/~pavlakos/phalp/3D/{fname}'\n    r\
    \ = subprocess.run(['curl', '-L', '-fSL', '-o', str(dst), url], capture_output=True, text=True)\n\
    \    if r.returncode != 0 or not dst.exists() or dst.stat().st_size != size:\n        sys.exit(f\"\
    FATAL: PHALP 3D {fname} failed: {r.stderr}\")\n    print(f\"  OK:   {fname} ({dst.stat().st_size}\
    \ bytes)\", flush=True)\n\n# RAFT (Dropbox zip) - 2 destinations\nprint(\"\\n=== RAFT (Dropbox) ===\"\
    , flush=True)\nraft_a = REPO / 'pipeline/environment/weight/raft-things.pth'\nraft_b = REPO / 'pipeline/environment/LAFC/flowCheckPoint/raft-things.pth'\n\
    if raft_a.exists() and raft_a.stat().st_size == 21108000 and raft_b.exists() and raft_b.stat().st_size\
    \ == 21108000:\n    print(f\"  skip: raft-things.pth x2\", flush=True)\nelse:\n    r = subprocess.run(['curl',\
    \ '-L', '-fSL', '-o', '/tmp/raft_models.zip',\n                        'https://dl.dropboxusercontent.com/s/4j4z58wuv8o0mfz/models.zip'],\n\
    \                       capture_output=True, text=True)\n    if r.returncode != 0:\n        sys.exit(f\"\
    FATAL: RAFT zip fetch failed: {r.stderr}\")\n    subprocess.run(['unzip', '-q', '-o', '/tmp/raft_models.zip',\
    \ '-d', '/tmp/'], check=True)\n    raft_a.parent.mkdir(parents=True, exist_ok=True)\n    raft_b.parent.mkdir(parents=True,\
    \ exist_ok=True)\n    subprocess.run(['cp', '/tmp/models/raft-things.pth', str(raft_a)], check=True)\n\
    \    subprocess.run(['cp', '/tmp/models/raft-things.pth', str(raft_b)], check=True)\n    subprocess.run(['rm',\
    \ '-rf', '/tmp/raft_models.zip', '/tmp/models'], check=False)\n    print(f\"  OK:   raft-things.pth\
    \ -> 2 locations ({raft_a.stat().st_size} bytes each)\", flush=True)\n\n# YOLOv8 duplicate\nyolo_a\
    \ = REPO / 'pipeline/track/phalp/trackers/yolov8l-seg.pt'\nyolo_b = REPO / 'pipeline/environment/tool/tool/yolov8l-seg.pt'\n\
    yolo_b.parent.mkdir(parents=True, exist_ok=True)\nif not (yolo_b.exists() and yolo_b.stat().st_size\
    \ == 92391859):\n    subprocess.run(['cp', str(yolo_a), str(yolo_b)], check=True)\n    print(f\"\\\
    n  OK:   yolov8l-seg.pt duplicated to tool/tool/\", flush=True)\nelse:\n    print(f\"\\n  skip: yolov8l-seg.pt\
    \ duplicate\", flush=True)\n\n# dinov2_zero_vector.pt - generated\nzv = REPO / 'model/backbones/dinov2_zero_vector.pt'\n\
    if not (zv.exists() and zv.stat().st_size == 2867366):\n    z = np.zeros((1, 700, 1024), dtype=np.float32)\n\
    \    with open(zv, 'wb') as f:\n        pickle.dump(z, f)\n    print(f\"  OK:   dinov2_zero_vector.pt\
    \ generated ({zv.stat().st_size} bytes)\", flush=True)\nelse:\n    print(f\"  skip: dinov2_zero_vector.pt\"\
    , flush=True)\n\n# Final total byte count\ntotal = 0\nfor root, _, files in os.walk(REPO):\n    for\
    \ f in files:\n        p = Path(root) / f\n        if p.suffix in ('.pt', '.pth', '.tar', '.pkl',\
    \ '.onnx', '.npz', '.npy'):\n            total += p.stat().st_size\nprint(f\"\\n  Total weight bytes:\
    \ {total / (1024**3):.2f} GB\")\nprint(\"\\n[C2] PASS - all auxiliary files in place.\")"
  cell_id: EsgKAiHZKB5q
- name: cell-4
  type: code
  source: "#@title D1) condacolab install (KERNEL WILL RESTART) { run: \"auto\" }\n# condacolab.check()\
    \ raises AssertionError when conda not found — use try/except.\n# condacolab.install() restarts the\
    \ kernel on first run. After restart, re-running\n# this cell hits the except-less branch and exits\
    \ clean.\nimport sys, subprocess\ntry:\n    import condacolab\nexcept ImportError:\n    subprocess.run(['pip',\
    \ '-q', 'install', 'condacolab==0.1.10'], check=True)\n    import condacolab\n\ntry:\n    condacolab.check()\n\
    \    print(\"  condacolab already installed - kernel ready.\")\nexcept AssertionError:\n    print(\"\
    \  Installing condacolab (kernel will restart) ...\")\n    condacolab.install()   # restarts kernel\
    \ here\n\nprint(\"\\n[D1] PASS - condacolab/mamba ready. Now run D2.\")"
  cell_id: qaCubhwxKRpv
- name: cell-5
  type: code
  source: "#@title D2) Launch install.sh (async — poll in next cells) { run: \"auto\" }\n# install.sh\
    \ builds mmcv-full + detectron2 + flash-attn. 15-30 min. Background thread.\n# 2026-04-21 fix: `conda\
    \ activate sabr` fails in non-interactive bash without conda.sh\n# hook sourced first. Patch install.sh\
    \ to source it before the activate block.\nimport os, subprocess, threading, time\nfrom pathlib import\
    \ Path\nos.chdir('/root/virtual-avatar-generation')\n\n# Pre-install osmesa for pyrender headless\
    \ GL (COMMON_ERRORS §21)\nprint(\"  Pre-install: libosmesa6-dev + libglfw3-dev ...\")\nsubprocess.run(['apt-get',\
    \ '-y', '-qq', 'install', 'libosmesa6-dev', 'libglfw3-dev'],\n               check=False, capture_output=True)\n\
    \n# Patch install.sh\ninstall_src = Path('install.sh').read_text()\nassert 'mamba create -n sabr'\
    \ in install_src, \"install.sh changed upstream\"\npatched = install_src.replace('bash ./prepare_data.sh',\n\
    \                              'echo \"[SKIP prepare_data.sh - see Cell C]\"')\npatched = patched.replace('wget\
    \ -qO- cli.runpod.net | sudo bash',\n                          'echo \"[SKIP runpod CLI - not needed\
    \ for Colab]\"')\n# (new 2026-04-21) source conda hook so `conda activate sabr` works in non-interactive\
    \ bash\npatched = patched.replace(\n    'conda activate sabr && {',\n    'source /usr/local/etc/profile.d/conda.sh\\\
    nconda activate sabr && {'\n)\n# Idempotent mamba create — don't fail on re-run if env already exists\n\
    patched = patched.replace(\n    'mamba create -n sabr python=3.10 -y',\n    'mamba env list | grep\
    \ -qE \"^sabr\\\\s\" || mamba create -n sabr python=3.10 -y'\n)\nassert '[SKIP prepare_data.sh' in\
    \ patched, \"patch failed\"\nassert 'source /usr/local/etc/profile.d/conda.sh' in patched, \"conda.sh\
    \ source patch failed\"\nPath('install_colab.sh').write_text(patched)\nsubprocess.run(['chmod', '+x',\
    \ 'install_colab.sh'], check=True)\n\n# Background launch\n_job = {'status': 'running', 'rc': None,\
    \ 'started_at': time.time()}\ndef _run_install():\n    try:\n        _job['rc'] = subprocess.run(\n\
    \            'bash -x install_colab.sh > /tmp/install_sabr.log 2>&1',\n            shell=True, cwd='/root/virtual-avatar-generation').returncode\n\
    \        _job['status'] = 'done'\n    except Exception as e:\n        _job['status'] = 'error'; _job['err']\
    \ = str(e)\n\n_t = threading.Thread(target=_run_install, daemon=True)\n_t.start()\nprint(f\"\\n  install.sh\
    \ launched (thread={_t.ident}).\")\nprint(f\"  Log: /tmp/install_sabr.log.  Expected 15-30 min.  Poll\
    \ via D2p.\")"
  cell_id: OyQ1TuqxKn0R
- name: cell-6
  type: code
  source: "#@title D2p) Poll install.sh progress { run: \"auto\" }\n# Re-run this cell every few minutes.\
    \ Shows elapsed + last 30 log lines.\nimport time, subprocess\nfrom pathlib import Path\n\nlog = Path('/tmp/install_sabr.log')\n\
    elapsed = (time.time() - _job['started_at']) / 60 if 'started_at' in _job else 0\n\nprint(f\"Status:\
    \ {_job.get('status')}\")\nprint(f\"rc:     {_job.get('rc')}\")\nprint(f\"Elapsed: {elapsed:.1f} min\"\
    )\nif log.exists():\n    size_kb = log.stat().st_size / 1024\n    n_lines = sum(1 for _ in open(log))\n\
    \    print(f\"Log:    {size_kb:.1f} KB, {n_lines} lines\")\n    print(\"\\n--- last 30 lines ---\"\
    )\n    r = subprocess.run(['tail', '-n', '30', str(log)], capture_output=True, text=True)\n    print(r.stdout)\n\
    else:\n    print(f\"Log not yet created.\")\n\nif _job.get('status') == 'done':\n    rc = _job.get('rc')\n\
    \    print(f\"\\n=== install.sh COMPLETE (rc={rc}) in {elapsed:.1f} min ===\")\n    if rc == 0:\n\
    \        # Verify sabr env exists\n        r = subprocess.run(['mamba', 'env', 'list'], capture_output=True,\
    \ text=True)\n        print(r.stdout)\n        if 'sabr' in r.stdout:\n            print(\"[D2] PASS\
    \ - sabr mamba env ready.\")\n        else:\n            print(\"[D2] FAIL - install.sh exit 0 but\
    \ sabr env missing!\")\n    else:\n        print(f\"[D2] FAIL - install.sh rc={rc}. Full log: {log}\"\
    )\n        print(\"\\n--- last 100 lines (context) ---\")\n        r = subprocess.run(['tail', '-n',\
    \ '100', str(log)], capture_output=True, text=True)\n        print(r.stdout)\nelif _job.get('status')\
    \ == 'error':\n    print(f\"\\n[D2] THREAD ERROR: {_job.get('err')}\")\nelse:\n    print(f\"\\n  (Still\
    \ running. Re-run this cell in 2-3 min.)\")"
  cell_id: aUwS5TNzKzFC
- name: cell-7
  type: code
  source: "#@title D2v) Verify critical packages in sabr env { run: \"auto\" }\nimport subprocess, textwrap\n\
    \ncheck_code = textwrap.dedent(\"\"\"\n    import importlib\n    targets = [\n        'torch', 'torchvision',\
    \ 'mmcv', 'mmdet', 'mmpose',\n        'timm', 'segment_anything', 'ultralytics', 'pyrender',\n   \
    \     'flash_attn', 'xformers', 'detectron2', 'hydra',\n        'cv2', 'onnxruntime', 'chumpy', 'PIL',\
    \ 'pyrootutils',\n        'joblib', 'einops', 'gdown', 'boto3',\n    ]\n    for name in targets:\n\
    \        try:\n            m = importlib.import_module(name)\n            v = getattr(m, '__version__',\
    \ 'ok')\n            print(f'  [ok]    {name:20s} = {v}')\n        except Exception as e:\n      \
    \      msg = f'{type(e).__name__}: {e}'[:90]\n            print(f'  [MISS]  {name:20s} - {msg}')\n\
    \    import torch\n    print()\n    print('  torch.cuda.is_available:', torch.cuda.is_available())\n\
    \    if torch.cuda.is_available():\n        print('  torch.cuda.get_device_name:', torch.cuda.get_device_name(0))\n\
    \"\"\")\n\nr = subprocess.run(\n    ['mamba', 'run', '-n', 'sabr', '--no-capture-output', 'python',\
    \ '-c', check_code],\n    capture_output=True, text=True)\nprint(r.stdout)\nif r.stderr:\n    print('---\
    \ stderr (last 1000 chars) ---')\n    print(r.stderr[-1000:])"
