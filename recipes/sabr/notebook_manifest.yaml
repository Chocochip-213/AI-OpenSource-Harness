    \ stub — flash_attn build failed on Colab A100 sm_80.\n# Route everything to torch SDPA. A100 has\
    \ native SDPA math/mem-efficient kernels.\n__version__ = \"2.5.8-stub\"\nimport warnings\nimport torch\n\
    import torch.nn.functional as F\n\ndef _to_bhsd(x):\n    \"\"\"flash-attn layout (B, S, H, D) -> SDPA\
    \ layout (B, H, S, D)\"\"\"\n    return x.transpose(1, 2)\n\ndef _to_bshd(x):\n    \"\"\"SDPA layout\
    \ (B, H, S, D) -> flash-attn layout (B, S, H, D)\"\"\"\n    return x.transpose(1, 2)\n\ndef flash_attn_func(q,\
    \ k, v, dropout_p=0.0, softmax_scale=None, causal=False, **kwargs):\n    \"\"\"q, k, v: (B, S, H,\
    \ D)\"\"\"\n    q, k, v = _to_bhsd(q), _to_bhsd(k), _to_bhsd(v)\n    out = F.scaled_dot_product_attention(q,\
    \ k, v, dropout_p=dropout_p,\n                                          is_causal=causal, scale=softmax_scale)\n\
    \    return _to_bshd(out)\n\ndef flash_attn_qkvpacked_func(qkv, dropout_p=0.0, softmax_scale=None,\
    \ causal=False, **kwargs):\n    \"\"\"qkv: (B, S, 3, H, D) — unpack to q/k/v, route to SDPA\"\"\"\n\
    \    q, k, v = qkv.unbind(dim=2)  # each (B, S, H, D)\n    return flash_attn_func(q, k, v, dropout_p=dropout_p,\n\
    \                            softmax_scale=softmax_scale, causal=causal)\n\ndef flash_attn_kvpacked_func(q,\
    \ kv, dropout_p=0.0, softmax_scale=None, causal=False, **kwargs):\n    \"\"\"q: (B, S, H, D), kv:\
    \ (B, S, 2, H, D)\"\"\"\n    k, v = kv.unbind(dim=2)\n    return flash_attn_func(q, k, v, dropout_p=dropout_p,\n\
    \                            softmax_scale=softmax_scale, causal=causal)\n\ndef flash_attn_varlen_func(*args,\
    \ **kwargs):\n    raise NotImplementedError(\"flash_attn_varlen_func stub — DiT shouldn't need it\"\
    )\n\ndef flash_attn_varlen_qkvpacked_func(*args, **kwargs):\n    raise NotImplementedError(\"flash_attn_varlen_qkvpacked_func\
    \ stub\")\n\ndef flash_attn_varlen_kvpacked_func(*args, **kwargs):\n    raise NotImplementedError(\"\
    flash_attn_varlen_kvpacked_func stub\")\n''')\nprint(\"  [2] flash_attn stub expanded (6 exports)\"\
    )\n\n# [3] pip install -e for pipeline/track to register 'phalp' package\nprint(\"  [3] Installing\
    \ pipeline/track as editable (phalp package) ...\")\nr = subprocess.run(\n    ['mamba', 'run', '-n',\
    \ 'sabr', '--no-capture-output',\n     'pip', 'install', '--no-deps', '-e', 'pipeline/track'],\n \
