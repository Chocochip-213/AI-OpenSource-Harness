      # NLF — Neural Localizer Fields → SMPL prediction
      Single image → SMPL pose+shape+joints+vertices via TorchScript.

      **Runtime**: Colab A100 40GB · 2025.07 (Python 3.11, torch 2.6.0+cu124).
      If wrong: **Runtime → Change runtime type**.

      **Time**: ~3–5 min cold (clone 30s · weight DL 60s · load 30s · inference 30s · viz/save 30s).

      **Source**: <https://github.com/isarandi/nlf> (pinned `f8611fc7…`). Code MIT;
      model weights non-commercial research use only.

      **Output**: 14-key dict (`boxes` + `pose` / `betas` / `trans` / `joints3d` / `vertices3d`
      / `joints2d` / `vertices2d` / `*_nonparam` / `*_uncertainties`) saved as
      `outputs/example_pred.pt` and triggered for download.

  - type: code
    source: |
      #@title B) Clone NLF Repo { run: "auto" }
      from pathlib import Path
      import os, subprocess

      REPO_URL = "https://github.com/isarandi/nlf.git"
      REPO_DIR = Path("/content/nlf")
      # Pinned to OpenCode-verified HEAD (2026-04-27). See recipes/nlf/recipe.yaml upstream.ref.
      PINNED_REF = "f8611fc76ff60f262eb0ab2c6abc3947e42a954a"

      if not REPO_DIR.exists():
          subprocess.check_call(["git", "clone", REPO_URL, str(REPO_DIR)])
      subprocess.check_call(["git", "-C", str(REPO_DIR), "checkout", PINNED_REF])

      os.chdir(REPO_DIR)
      assert (REPO_DIR / "example_image.jpg").is_file(), \
          "example_image.jpg missing — upstream may have rewritten the demo asset layout"
      assert (REPO_DIR / "demo.ipynb").is_file(), "demo.ipynb missing"
      print({
          "cwd": str(Path.cwd()),
          "has_example_image": True,
          "has_demo_notebook": True,
      })

  - type: code
    source: |
      #@title C) Ensure Runtime Packages { run: "auto" }
      # Fail-fast: catch missing deps NOW, not 30 min later during inference.
      # NLF MVP minimum: torch + torchvision (verified by OpenCode A4 dependency audit).
      # Pillow + matplotlib are convenience for image I/O + cell H viz.
      # All 4 are pre-installed on Colab 2025.07 — pip install is a fallback for non-stock runtimes.
      import importlib.util, subprocess, sys

      required = {
          "torch": "torch",
          "torchvision": "torchvision",
          "PIL": "Pillow",
          "matplotlib": "matplotlib",
      }

      missing = [pip_name for module_name, pip_name in required.items()
                 if importlib.util.find_spec(module_name) is None]

      if missing:
          print(f"Installing missing: {missing}")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", *missing])

      still_missing = [m for m in required if importlib.util.find_spec(m) is None]
      assert not still_missing, f"FATAL: failed to install {still_missing}"
      print({"all_present": True, "checked": list(required.keys())})

      import torch
      assert torch.cuda.is_available(), "CUDA GPU is required for this notebook."
      print({"torch": torch.__version__, "cuda": torch.version.cuda,
             "gpu": torch.cuda.get_device_name(0)})

  - type: code
    source: |
      #@title D) Download TorchScript Model (473 MB) { run: "auto" }
      from pathlib import Path
      import urllib.request

      # Verified by OpenCode A8 via `curl -IL https://bit.ly/nlf_l_pt` (Content-Length).
      EXPECTED_BYTES = 495_696_900
      MODEL_URL = "https://bit.ly/nlf_l_pt"
      MODELS_DIR = REPO_DIR / "models"
      MODELS_DIR.mkdir(exist_ok=True)
      MODEL_PATH = MODELS_DIR / "nlf_l_multi.torchscript"

      need_download = (
          not MODEL_PATH.exists()
          or MODEL_PATH.stat().st_size != EXPECTED_BYTES
      )
      if need_download:
          print(f"Downloading {MODEL_URL} -> {MODEL_PATH} ...")
          urllib.request.urlretrieve(MODEL_URL, MODEL_PATH)

      actual_bytes = MODEL_PATH.stat().st_size
      assert actual_bytes == EXPECTED_BYTES, \
          f"Size mismatch: {actual_bytes} != {EXPECTED_BYTES} - bit.ly may have rotated; " \
          "check https://github.com/isarandi/nlf/releases for direct asset URL."
      print({"model_path": str(MODEL_PATH), "bytes": actual_bytes})

  - type: code
    source: |
      #@title E) Load Model + Bundled Image { run: "auto" }
      import torch
      # IMPORTANT: must import torchvision BEFORE torch.jit.load
      # (per upstream demo.ipynb cell 1 inline comment, verified OpenCode A2).
      import torchvision

      DEVICE = "cuda"  # NEVER "cuda:1" - A3 documented `CUDA error: invalid device ordinal`.
      IMAGE_PATH = REPO_DIR / "example_image.jpg"

      # Cache model in globals() for cell re-run safety (harness pipeline-caching pattern).
      if "model" not in globals():
          model = torch.jit.load(str(MODEL_PATH)).to(DEVICE).eval()

      image = torchvision.io.read_image(str(IMAGE_PATH)).to(DEVICE)
      frame_batch = image.unsqueeze(0)

      print({
          "device": DEVICE,
          "image_shape": tuple(image.shape),
          "frame_batch_shape": tuple(frame_batch.shape),
          "dtype": str(image.dtype),
      })
      assert frame_batch.ndim == 4 and frame_batch.shape[0] == 1, \
          "frame_batch shape invariant violated"
      assert frame_batch.is_cuda, "frame_batch must be on cuda"

  - type: code
    source: |
      #@title F) Run detect_smpl_batched { run: "auto" }
      # Default args verified at nlf/pt/multiperson/multiperson_model.py:84-107
      # (parametric base; `detect_smpl_batched` is the SMPL-flavored alias at :175):
      #   default_fov_degrees=55.0, max_detections=150, model_name='smpl'.
      # `torch.device("cuda")` context manager mirrors upstream demo.ipynb cell 1.
      #
      # Re-running this cell intentionally re-runs inference (no globals() cache for `pred`)
      # so swapping the input image in cell E and re-running F produces fresh predictions.
      with torch.inference_mode(), torch.device("cuda"):
          pred = model.detect_smpl_batched(frame_batch)

      print(sorted(pred.keys()))
      print(f"n_images_returned: {len(pred['pose'])}")
      assert isinstance(pred, dict) and "pose" in pred, "Expected dict with 'pose' key"
      assert len(pred["pose"]) == frame_batch.shape[0], "Output batch size mismatch"

  - type: code
    source: |
      #@title G) Verify Output Contract { run: "auto" }
      # Expected keys verified against nlf/pt/multiperson/multiperson_model.py:
      #   - Main path (detections > 0): :221-314 — `boxes` survives at :221, joints/verts/
      #     uncertainties added at :273-308; only `poses3d`/`poses2d`/`uncertainties` are
      #     deleted at :311-313 → return dict has 14 keys including `boxes`.
      #   - Empty-detection fallback: :880-894 returns 13 keys (drops `boxes`).
      # We assert all 14. Empty detection on example_image.jpg would indicate a model
      # regression or an image without a person — fail-fast is the right behavior.
      EXPECTED_KEYS = {
          "boxes",
          "pose", "betas", "trans",
          "joints3d", "vertices3d",
          "joints2d", "vertices2d",
          "joints3d_nonparam", "vertices3d_nonparam",
          "joints2d_nonparam", "vertices2d_nonparam",
          "joint_uncertainties", "vertex_uncertainties",
      }

      pred_summary = {
          k: [tuple(x.shape) for x in v] if isinstance(v, list) else type(v).__name__
          for k, v in pred.items()
      }
      print(pred_summary)

      missing_keys = EXPECTED_KEYS - pred.keys()
      assert not missing_keys, \
          f"Missing expected keys: {missing_keys} - this indicates either NO PERSON DETECTED " \
          "(check input image / detector_threshold) OR upstream changed schema. " \
          "Compare against nlf/pt/multiperson/multiperson_model.py:221-314 (main path) " \
          "or :880-894 (empty fallback) and context.md Architecture."
      print(f"All {len(EXPECTED_KEYS)} expected keys present.")

  - type: code
    source: |
      #@title H) Visualize 2D Mesh + Joints Overlay { run: "auto" }
      # Use returned vertices2d / joints2d directly (pre-projected by the TorchScript model).
      # No `ptu3d` / `cameralib` dependency needed - see context.md Key Decision.
      import matplotlib.pyplot as plt

      img_np = image.detach().cpu().permute(1, 2, 0).numpy()
      verts2d_np = pred["vertices2d"][0].detach().cpu().numpy().reshape(-1, 2)
      joints2d_np = pred["joints2d"][0].detach().cpu().numpy().reshape(-1, 2)

      fig, ax = plt.subplots(figsize=(10, 7))
      ax.imshow(img_np)
      if len(verts2d_np):
          ax.scatter(verts2d_np[:, 0], verts2d_np[:, 1], s=1, c="r", alpha=0.35,
                     label=f"verts2d ({len(verts2d_np)})")
      if len(joints2d_np):
          ax.scatter(joints2d_np[:, 0], joints2d_np[:, 1], s=8, c="cyan", alpha=0.8,
                     label=f"joints2d ({len(joints2d_np)})")
      ax.set_axis_off()
      ax.set_title(f"NLF - image 0 - {len(verts2d_np)} verts - {len(joints2d_np)} joints")
      ax.legend(loc="lower right", fontsize=8)
      plt.show()

  - type: code
    source: |
      #@title I) Save Outputs + Download { run: "auto" }
      from pathlib import Path

      OUTPUT_DIR = REPO_DIR / "outputs"
      OUTPUT_DIR.mkdir(exist_ok=True)
      PRED_PATH = OUTPUT_DIR / "example_pred.pt"

      # Move tensors to CPU before save (smaller pickle, no CUDA dependency on reload).
      pred_cpu = {
          k: [x.detach().cpu() for x in v] if isinstance(v, list) else v
          for k, v in pred.items()
      }
      torch.save(pred_cpu, PRED_PATH)
      print({"saved_to": str(PRED_PATH), "bytes": PRED_PATH.stat().st_size})

      # Trigger download in Colab; no-op locally.
      try:
          from google.colab import files
          files.download(str(PRED_PATH))
      except ImportError:
          print("Not in Colab - skipping files.download()")
