  type: code
  source: "#@title D4) Finish remaining packages (numpy pin first, async) { run: \"auto\" }\n# Round 2:\
    \ D3 left mmpose/chumpy/onnxruntime/ultralytics/joblib broken, mostly due to\n# numpy 2.2.6 reinstalled\
    \ by xformers. Force numpy<2 FIRST, then install/rebuild the\n# numpy-1.x-only packages in order.\n\
    import subprocess, threading, time, textwrap\nfrom pathlib import Path\n\nscript = textwrap.dedent(\"\
    \"\"\n    set +e\n    source /usr/local/etc/profile.d/conda.sh\n    conda activate sabr\n\n    echo\
    \ \"=== [1] Pin numpy<2 BEFORE anything else ===\"\n    pip uninstall -y numpy 2>&1 | tail -2\n  \
    \  pip install --no-cache-dir 'numpy==1.26.4' 2>&1 | tail -3\n\n    echo \"=== [2] joblib + mmpose\
    \ ===\"\n    pip install --no-cache-dir joblib mmpose==0.24.0 2>&1 | tail -3\n\n    echo \"=== [3]\
    \ chumpy (no-build-isolation so it uses our numpy==1.26.4) ===\"\n    pip install --no-cache-dir --no-build-isolation\
    \ chumpy 2>&1 | tail -10\n\n    echo \"=== [4] onnxruntime-gpu rebuild for numpy<2 ===\"\n    pip\
    \ uninstall -y onnxruntime onnxruntime-gpu 2>&1 | tail -2\n    pip install --no-cache-dir onnxruntime-gpu==1.17.1\
    \ 2>&1 | tail -3\n\n    echo \"=== [5] Verify numpy didn't get bumped ===\"\n    python -c \"import\
    \ numpy; print('numpy:', numpy.__version__)\"\n\n    echo \"=== [6] ultralytics matplotlib fix (uninstall\
    \ matplotlib-inline) ===\"\n    pip uninstall -y matplotlib-inline 2>&1 | tail -2\n    pip install\
    \ --no-cache-dir --force-reinstall --no-deps ultralytics==8.0.99 2>&1 | tail -3\n\n    echo \"===\
    \ [7] detectron2 retry with torch 2.1 in place ===\"\n    pip install --no-cache-dir 'git+https://github.com/facebookresearch/detectron2.git'\
    \ 2>&1 | tail -5 || echo \"[SKIP detectron2]\"\n\n    echo \"=== [DONE] ===\"\n\"\"\").strip()\n\n\
    Path('/tmp/fix_sabr2.sh').write_text(script)\nsubprocess.run(['chmod', '+x', '/tmp/fix_sabr2.sh'],\
    \ check=True)\n\n_fix2 = {'status': 'running', 'rc': None, 'started_at': time.time()}\ndef _run():\n\
    \    try:\n        _fix2['rc'] = subprocess.run(\n            'bash /tmp/fix_sabr2.sh > /tmp/fix_sabr2.log\
    \ 2>&1',\n            shell=True).returncode\n        _fix2['status'] = 'done'\n    except Exception\
    \ as e:\n        _fix2['status'] = 'error'; _fix2['err'] = str(e)\nthreading.Thread(target=_run, daemon=True).start()\n\
    \nprint(\"Fix2 launched. Poll /tmp/fix_sabr2.log. Expected 4-8 min.\")"
