- name: cell-64
  type: code
  source: "#@title Verify) Avatar visibility check { run: \"auto\" }\n# Sample 5 frames from output; compare\
    \ to input at same timestamps.\n# If outputs == inputs → no avatar rendered (failure). If very different\
    \ → avatar overlaid.\nimport subprocess, os, hashlib, json\nfrom pathlib import Path\n\nHOME = os.environ['HOME']\n\
    VAG = Path(HOME) / 'virtual-avatar-generation'\nos.chdir(VAG)\n\n# Find most recent video under output/\n\
    out_dir = VAG / 'output'\nvideos = sorted(out_dir.glob('*.mp4'), key=lambda p: p.stat().st_mtime,\
    \ reverse=True)\nif not videos:\n    raise SystemExit(\"no output video found\")\nout_vid = videos[0]\n\
    print(f\"Output: {out_vid}  ({out_vid.stat().st_size/1e6:.2f} MB)\")\nprint(f\"mtime:  {subprocess.check_output(['stat',\
    \ '-c', '%y', str(out_vid)]).decode().strip()}\")\n\n# Find input - look under vids_*/ or user-uploads\n\
    candidates = []\nfor p in VAG.glob('vids_*/*.mp4'):\n    candidates.append(p)\nfor p in (VAG / 'user-uploads').glob('*.mp4')\
    \ if (VAG / 'user-uploads').exists() else []:\n    candidates.append(p)\ninput_vids = [p for p in\
    \ candidates if 'output' not in str(p).lower()]\nprint(f\"Inputs found: {len(input_vids)}\")\nfor\
    \ p in input_vids[:5]:\n    print(f\"  {p}\")\n\n# Extract 5 frames from each video: at 0.1, 0.3,\
    \ 0.5, 0.7, 0.9 of duration\nimport numpy as np\nimport cv2\n\ndef sample_frames(vid_path, n=5):\n\
    \    cap = cv2.VideoCapture(str(vid_path))\n    total = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))\n \
    \   frames = []\n    for frac in [0.1, 0.3, 0.5, 0.7, 0.9]:\n        cap.set(cv2.CAP_PROP_POS_FRAMES,\
    \ int(total * frac))\n        ret, f = cap.read()\n        if ret: frames.append((int(total*frac),\
    \ f))\n    cap.release()\n    return frames\n\nout_frames = sample_frames(out_vid)\nprint(f\"\\nOutput\
    \ frames sampled: {len(out_frames)}\")\n\n# Quick variance check: output frames should have meaningful\
    \ pixel variance\nfor idx, (fn, f) in enumerate(out_frames):\n    h, w = f.shape[:2]\n    # variance\
    \ per channel\n    std = f.std(axis=(0,1))\n    mean = f.mean(axis=(0,1))\n    print(f\"  Frame {fn}:\
    \ shape={f.shape}  mean_bgr={mean.round(1).tolist()}  std_bgr={std.round(1).tolist()}\")\n\n# If there's\
    \ a matching input, also compare\nif input_vids:\n    inp = input_vids[0]\n    in_frames = sample_frames(inp)\n\
    \    print(f\"\\nInput frames sampled from {inp.name}: {len(in_frames)}\")\n    for (ofn, of), (ifn,\
    \ iff) in zip(out_frames, in_frames):\n        # Resize input to output dims if different\n      \
    \  oh, ow = of.shape[:2]\n        if iff.shape[:2] != (oh, ow):\n            iff = cv2.resize(iff,\
    \ (ow, oh))\n        diff = np.abs(of.astype(np.int16) - iff.astype(np.int16)).mean()\n        print(f\"\
    \  Frame ~{ofn}: mean_abs_diff(out-in) = {diff:.2f}  (0=identical, >20=clearly different)\")\n"
