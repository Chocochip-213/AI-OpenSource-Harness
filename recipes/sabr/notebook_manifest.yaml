- name: cell-36
  type: code
  source: "#@title D13) Re-apply matplotlibrc Agg + launch H { run: \"auto\" }\nimport subprocess, re\n\
    from pathlib import Path\n\nmpl_rc = Path('/usr/local/envs/sabr/lib/python3.10/site-packages/matplotlib/mpl-data/matplotlibrc')\n\
    if mpl_rc.exists():\n    mrc = mpl_rc.read_text()\n    new = re.sub(r'^(#\\s*)?backend\\s*:\\s*.*$',\
    \ 'backend: Agg', mrc, count=1, flags=re.MULTILINE)\n    if 'backend: Agg' not in new:\n        new\
    \ = 'backend: Agg\\n' + mrc\n    mpl_rc.write_text(new)\n    print(f\"  matplotlibrc -> Agg\")\n\n\
    # Also set MPLBACKEND via python code env for extra safety — add to inference.py top\ninf = Path('/root/virtual-avatar-generation/inference.py')\n\
