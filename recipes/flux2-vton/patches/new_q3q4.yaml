      #@title Q-4. 4-Size VTON Generation (Torso-Warped Person)
      if PIPELINE != "D":
          print(">>> Skipped (Pipeline A selected)")
      else:
          import torch
          import time
          import inspect
          from PIL import Image, ImageDraw
          from IPython.display import display

          SIZES = [
              "M(95)", "L(100)",
              "XL(105)", "2XL(110-115)",
          ]
          d_results = {}

          print("Pipeline D: 4-Size VTON")
          print("  Method: Person Torso Pre-Warp")
          print("  (No compositing - model generates directly)")
          print("=" * 55)

          sig = inspect.signature(pipe.__call__)
          supported_params = set(sig.parameters.keys())

          for i, size in enumerate(SIZES):
              t0 = time.time()
              scale = TORSO_SCALE[size]

              if scale <= 1.0:
                  # M = use existing Pass 1 result
                  d_results[size] = pass1_result
                  print(f"[{i+1}/4] {size}: "
                        f"Pass 1 (fitted) - 0.0s")
                  continue

              # Get warped person + scaled garment
              wp = WARPED_PERSONS[size]
              g_img = scale_garment(garment_image, size)

              # Build size-specific prompt
              prompt = build_fitspec_prompt(
                  FITSPEC, size_override=size,
              )

              kwargs = dict(
                  prompt=prompt,
                  image=[wp, g_img, wp],
                  height=out_h,
                  width=out_w,
                  num_inference_steps=28,
                  guidance_scale=4.0,
                  generator=torch.Generator(
                      "cuda"
                  ).manual_seed(SEED),
              )
              if "max_sequence_length" in supported_params:
                  kwargs["max_sequence_length"] = 512

              result = pipe(**kwargs)
              d_results[size] = result.images[0]
              elapsed = time.time() - t0
              fit = SIZE_TO_FIT_D.get(size, "regular")
              print(f"[{i+1}/4] {size} "
                    f"(x{scale}, {fit}): "
                    f"{elapsed:.1f}s")

          # Build 2x2 grid
          print("\nBuilding 4-Size grid...")
          cell_h, cell_w = 512, 384
          padding = 10
          label_h = 30
          grid_w = cell_w * 2 + padding * 3
          grid_h = (
              (cell_h + label_h) * 2 + padding * 3
          )

          d_grid = Image.new(
              "RGB", (grid_w, grid_h),
              (255, 255, 255),
          )
          draw = ImageDraw.Draw(d_grid)

          for idx, size in enumerate(SIZES):
              row, col = divmod(idx, 2)
              x = padding + col * (cell_w + padding)
              y = padding + row * (
                  cell_h + label_h + padding
              )
              fit = SIZE_TO_FIT_D.get(size, "regular")
              scale = TORSO_SCALE[size]
              draw.text(
                  (x + 5, y + 2),
                  f"{size} [{fit}, x{scale}]",
                  fill=(0, 0, 0),
              )
              img = d_results[size].resize(
                  (cell_w, cell_h), Image.LANCZOS,
              )
              d_grid.paste(img, (x, y + label_h))

          display(d_grid)
          print("\nPipeline D 4-Size grid complete")
          print("(Each size = separate VTON generation, "
                "no compositing)")

