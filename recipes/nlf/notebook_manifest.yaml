      #@title D) Download TorchScript Model (473 MB) { run: "auto" }
      from pathlib import Path
      import urllib.request

      EXPECTED_BYTES = 495_696_900  # OpenCode A8 verified Content-Length
      MODELS_DIR = REPO_DIR / "models"; MODELS_DIR.mkdir(exist_ok=True)
      MODEL_PATH = MODELS_DIR / "nlf_l_multi.torchscript"

      if not MODEL_PATH.exists() or MODEL_PATH.stat().st_size != EXPECTED_BYTES:
          print(f"Downloading https://bit.ly/nlf_l_pt -> {MODEL_PATH}")
