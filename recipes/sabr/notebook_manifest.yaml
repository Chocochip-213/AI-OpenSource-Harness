- name: cell-31
  type: code
  source: "#@title E5) Init missing self.processNumber + wrap context-frame cmd in skip guard { run: \"\
    auto\" }\nfrom pathlib import Path\n\ninf = Path('/root/virtual-avatar-generation/inference.py')\n\
    src = inf.read_text()\n\n# Fix 1: default processNumber=0 so command-list evaluation doesn't AttributeError.\n\
    # Already have `self.skip_context = skip_context` injected — add processNumber there.\nanchor1 = \"\
    self.skip_context = skip_context\"\nif \"self.processNumber\" not in src:\n    assert anchor1 in src,\
    \ \"FAIL: skip_context anchor not found (P4c patch broken?)\"\n    src = src.replace(anchor1,\n  \
    \                    \"self.skip_context = skip_context\\n        self.processNumber = 0\", 1)\n \
    \   print(\"  [1] Added self.processNumber = 0 default\")\nelse:\n    print(\"  [1] processNumber\
    \ already set\")\n\n# Fix 2: wrap the getContextFrames command-list construction in skip guard too\n\
    # (my P4d patch only wrapped subprocess.run, not the list construction above it).\n# Anchor on \"\
    getContextFrames = [\" before the list; wrap up to the subprocess.run end.\n# Easier: comment out\
    \ the list construction when skip_context by using a lambda-like\n# guard via short-circuit. But simplest\
    \ is to wrap both the list AND the subprocess.\n# We already have `if not self.skip_context:` wrapping\
    \ subprocess.run. Move the list up.\n\n# Find the block to wrap - from \"getContextFrames = [\" to\
    \ after \"cwd=self.context_tool_dir, check=True)\"\nimport re\n# Current structure (after my patches):\n\
    #     getContextFrames = [\n#         \"python\",\n#         context_path,\n#         ...\n#     \
    \    \"--processNumber\", str(self.processNumber)\n#     ]\n#     if not self.skip_context:\n#   \
    \      subprocess.run(getContextFrames, cwd=self.context_tool_dir, check=True)\n#     else:\n#   \
    \      print('[skipContext] ...')\n\n# Find the list literal and wrap everything in one if\nm = re.search(r\"\
    \        getContextFrames = \\[\\n(            .*\\n)+?        \\]\\n\", src)\nif m:\n    list_block\
    \ = m.group(0)\n    # Only wrap if not already wrapped\n    if \"if not self.skip_context:\\n    \
    \        getContextFrames\" not in src:\n        # Indent the list block 4 more spaces\n        indented\
    \ = \"\\n\".join(\"    \" + line if line else line\n                              for line in list_block.splitlines())\
    \ + \"\\n\"\n        # Replace the current unwrapped list + my existing if/else block with a single\n\
    \        # wrapped if/else\n        wrapped = \"        if not self.skip_context:\\n\" + indented\
    \ + \\\n                  \"            subprocess.run(getContextFrames, cwd=self.context_tool_dir,\
    \ check=True)\\n\" + \\\n                  \"        else:\\n\" + \\\n                  \"       \
    \     print('[skipContext] skipping GroundingDINO+AOT context extraction')\\n\"\n        # Replace\
    \ the block between list_block start and the existing if/else end\n        # Build pattern covering\
    \ list_block + \"        if not self.skip_context:\\n...\" through else print\n        full_pattern\
    \ = re.compile(\n            r\"        getContextFrames = \\[\\n(?:            .*\\n)+?        \\\
    ]\\n\"\n            r\"        if not self\\.skip_context:\\n\"\n            r\"            subprocess\\\
    .run\\(getContextFrames, cwd=self\\.context_tool_dir, check=True\\)\\n\"\n            r\"        else:\\\
    n\"\n            r\"            print\\(.*\\)\\n\",\n            re.M)\n        new_src = full_pattern.sub(wrapped,\
    \ src)\n        if new_src != src:\n            inf.write_text(new_src)\n            print(\"  [2]\
    \ getContextFrames list wrapped in skip_context guard\")\n        else:\n            print(\"  [2]\
    \ Could not re-wrap — check manually\")\n    else:\n        print(\"  [2] already wrapped\")\nelse:\n\
    \    print(\"  [2] getContextFrames list not found — may be already refactored\")\n\n# Final verify\n\
    import subprocess\nr = subprocess.run(['mamba', 'run', '-n', 'sabr', '--no-capture-output',\n    \
    \                'python', '-c',\n                    'import py_compile; py_compile.compile(\"/root/virtual-avatar-generation/inference.py\"\
    , doraise=True); print(\"compile OK\")'],\n                   capture_output=True, text=True)\nprint(\"\
    \\n  syntax:\", r.stdout.strip() or r.stderr.strip()[-300:])"
