      #@title C) Ensure Runtime Packages { run: "auto" }
      # Fail-fast dep verification. torch+torchvision pre-installed on Colab 2025.07/2026.04.
      # fastapi+uvicorn+python-multipart for the serving cells. Pillow for PIL decode.
      import importlib.util, subprocess, sys

      required = {
          "torch": "torch", "torchvision": "torchvision",
          "PIL": "Pillow",
          "fastapi": "fastapi", "uvicorn": "uvicorn[standard]",
          "multipart": "python-multipart", "requests": "requests",
      }
      missing = [pip for mod, pip in required.items() if importlib.util.find_spec(mod) is None]
      if missing:
          print(f"Installing: {missing}")
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", *missing])

      still = [m for m in required if importlib.util.find_spec(m) is None]
      assert not still, f"FATAL: failed to install {still}"

      import torch
      assert torch.cuda.is_available(), "CUDA GPU required"
      print({"all_present": True, "torch": torch.__version__,
             "cuda": torch.version.cuda, "gpu": torch.cuda.get_device_name(0)})

