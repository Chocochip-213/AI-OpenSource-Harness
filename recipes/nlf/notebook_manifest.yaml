    source: |
      #@title I) cloudflared tunnel → public endpoint URL { run: "auto" }
      # 무료 quick tunnel — *.trycloudflare.com 임시 URL (세션마다 회전).
      # 영구 URL은 Cloudflare 계정 + named tunnel 필요.
      import os, subprocess, threading, queue, re, time
      from pathlib import Path

      CF = Path("/usr/local/bin/cloudflared")
      if not CF.exists():
          print("[install] downloading cloudflared linux-amd64...")
          subprocess.check_call([
              "wget", "-q",
              "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64",
              "-O", str(CF),
          ])
          os.chmod(CF, 0o755)
      print(f"[cloudflared] {subprocess.check_output([str(CF), '--version']).decode().strip()}")

      PORT = 7860
      LOG = Path("/tmp/cloudflared.log"); LOG.unlink(missing_ok=True)
      _q = queue.Queue()

      def _tunnel():
          p = subprocess.Popen(
              [str(CF), "tunnel", "--url", f"http://localhost:{PORT}",
               "--no-autoupdate", "--logfile", str(LOG)],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1,
          )
          for line in p.stdout: _q.put(line)

      _existing = globals().get('_tunnel_thread')
      if _existing is None or not _existing.is_alive():
          _tunnel_thread = threading.Thread(target=_tunnel, daemon=True)
          _tunnel_thread.start()
          print("[tunnel] starting...")
      else:
          print("[tunnel] already running")

      URL_RE = re.compile(r'https://[a-z0-9-]+\.trycloudflare\.com')
      url = None
      deadline = time.time() + 60
      while time.time() < deadline and not url:
          try:
              line = _q.get(timeout=2)
              m = URL_RE.search(line)
              if m: url = m.group(0); break
          except queue.Empty:
              pass
          if LOG.exists():
              m = URL_RE.search(LOG.read_text())
              if m: url = m.group(0); break

      if url:
          PUBLIC_URL = url
          print(f"\n  PUBLIC URL: {url}")
          print(f"  curl {url}/health")
          print(f"  curl -X POST -F 'file=@selfie.jpg' {url}/embed")
          print(f"  Swagger UI: {url}/docs")
          print(f"\n  (Session-rotating URL. Permanent: Cloudflare account + named tunnel.)")
      else:
          PUBLIC_URL = None
          print("[tunnel] URL not detected in 60s. Last log:")
          if LOG.exists(): print(LOG.read_text()[-2000:])

  - type: code
    source: |
      #@title J) Forever-loop — keep Colab session alive { run: "auto" }
      # Colab은 90분 idle 후 disconnect. 이 셀이 무한 foreground 루프 → cell 항상 active → idle 0.
      # 12-hour hard cap (Colab Pro 기준)은 회피 불가. 더 오래 서비스하려면 cron 재기동 필요.
      # Ctrl+M I (interrupt) 또는 Runtime > Disconnect로 정지.
      import time, datetime, requests

      print(f"  Endpoint serving (cell I 출력의 PUBLIC URL 참고).")
      print(f"  Cell J holding session alive via foreground loop.")
      print(f"  정지: 이 셀 interrupt OR Runtime > Disconnect.\n")

      _heartbeat_period = 60  # seconds
      while True:
          now = datetime.datetime.now().strftime("%H:%M:%S")
          try:
              h = requests.get("http://localhost:7860/health", timeout=2).json()
              status = f"vram_free={h.get('vram_gb_free','?')}GB · model={h.get('model_loaded')}"
          except Exception as e:
              status = f"health_check_fail: {type(e).__name__}"
          print(f"[{now}] alive · {status}", flush=True)
          time.sleep(_heartbeat_period)
