- name: cell-8
  type: code
  source: "#@title D3) Fix sabr env — CUDA torch + missing critical packages (async) { run: \"auto\" }\n\
    # install.sh left sabr env in broken state: torch 2.10 CPU-only, mmcv/mmdet/mmpose/\n# chumpy/joblib\
    \ missing, onnxruntime ABI crash on numpy 2.x, flash-attn/detectron2 failed.\n# Strategy: reinstall\
    \ torch==2.1.0+cu121 (has mmcv 1.7.x pre-built wheels), numpy<2\n# (for 2022-era C-ext ABI), mmcv-full\
    \ via mim, mmdet/mmpose pinned, chumpy/joblib,\n# onnxruntime-gpu compat. flash-attn: SKIP entirely\
    \ (use SDPA shim in Cell F).\n# detectron2: try once; if fails keep going (PHALP subprocess may or\
    \ may not need it).\nimport subprocess, threading, time, textwrap\nfrom pathlib import Path\n\nfix_script\
    \ = textwrap.dedent(\"\"\"\n    set +e  # best-effort — some installs may fail but keep going\n  \
    \  source /usr/local/etc/profile.d/conda.sh\n    conda activate sabr\n\n    echo \"=== [0] uninstall\
    \ broken torch nightly ===\"\n    pip uninstall -y torch torchvision torchaudio xformers flash-attn\
    \ detectron2 2>&1 | tail -5\n\n    echo \"=== [1] torch 2.1.0 + cu121 (has mmcv-full 1.7.x pre-built\
    \ wheels) ===\"\n    pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cu121\
    \ \\\\\n        torch==2.1.0 torchvision==0.16.0 torchaudio==2.1.0 2>&1 | tail -3\n\n    echo \"===\
    \ [2] numpy<2 (mmcv/mmdet/onnxruntime ABI) ===\"\n    pip install --no-cache-dir 'numpy<2' 2>&1 |\
    \ tail -3\n\n    echo \"=== [3] mmcv-full 1.7.2 via pip (skip mim — slower) ===\"\n    pip install\
    \ --no-cache-dir mmcv-full==1.7.2 \\\\\n        -f https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/index.html\
    \ 2>&1 | tail -3\n\n    echo \"=== [4] mmdet 2.28.1 + mmpose 0.24.0 ===\"\n    pip install --no-cache-dir\
    \ mmdet==2.28.1 mmpose==0.24.0 2>&1 | tail -3\n\n    echo \"=== [5] chumpy joblib packaging ===\"\n\
    \    pip install --no-cache-dir chumpy joblib packaging 2>&1 | tail -3\n\n    echo \"=== [6] xformers\
    \ 0.0.23.post1 (matches torch 2.1) ===\"\n    pip install --no-cache-dir xformers==0.0.23.post1 2>&1\
    \ | tail -3\n\n    echo \"=== [7] onnxruntime-gpu rebuild (for numpy<2 + CUDA 12) ===\"\n    pip uninstall\
    \ -y onnxruntime onnxruntime-gpu 2>&1 | tail -2\n    pip install --no-cache-dir onnxruntime-gpu==1.17.1\
    \ 2>&1 | tail -3\n\n    echo \"=== [8] ultralytics reinstall (fix matplotlib inline backend) ===\"\
    \n    pip install --no-cache-dir --force-reinstall --no-deps ultralytics==8.0.99 2>&1 | tail -3\n\n\
    \    echo \"=== [9] detectron2 (best-effort; PHALP may or may not need) ===\"\n    pip install --no-cache-dir\
    \ 'git+https://github.com/facebookresearch/detectron2.git' 2>&1 | tail -5 || echo \"[SKIP detectron2\
    \ build failed]\"\n\n    echo \"=== [DONE] ===\"\n\"\"\").strip()\n\nPath('/tmp/fix_sabr.sh').write_text(fix_script)\n\
    subprocess.run(['chmod', '+x', '/tmp/fix_sabr.sh'], check=True)\n\n_fix = {'status': 'running', 'rc':\
    \ None, 'started_at': time.time()}\ndef _run_fix():\n    try:\n        _fix['rc'] = subprocess.run(\n\
    \            'bash /tmp/fix_sabr.sh > /tmp/fix_sabr.log 2>&1',\n            shell=True).returncode\n\
    \        _fix['status'] = 'done'\n    except Exception as e:\n        _fix['status'] = 'error'; _fix['err']\
    \ = str(e)\nthreading.Thread(target=_run_fix, daemon=True).start()\n\nprint(\"Fix launched in background.\
    \ Poll with D3p.\")\nprint(\"Expected 8-15 min (torch 2.1 + mmcv wheel + misc pips).\")"
