    \    inf_py.write_text(src)\n    print(\"  [1] inference.py patched: strip .mp4 from video_name\"\
    )\nelse:\n    print(\"  [1] already patched\")\n\n# [2] detectron2 pre-built wheel. Try torch 2.1\
