      #@title Q-3. Person Torso Pre-Warp (Size Simulation)
      if PIPELINE != "D":
          print(">>> Skipped (Pipeline A selected)")
      else:
          import numpy as np
          import cv2
          import torch
          import torch.nn.functional as F
          from PIL import Image, ImageDraw
          from IPython.display import display

          #@markdown ### Torso Warp Settings
          #@markdown Person torso를 사이즈별로 수평 확장하여
          #@markdown VTON 모델이 자연스럽게 큰 옷을 생성하도록 유도.
          FADE_PX = 30  #@param {type:"slider", min:10, max:60, step:5}

          # Size -> torso horizontal scale factor
          TORSO_SCALE = {
              "M(95)": 1.00,
              "L(100)": 1.06,
              "XL(105)": 1.12,
              "2XL(110-115)": 1.20,
          }

          # 1. Segment ORIGINAL person to find torso region
          print("Segmenting original person for torso bounds...")
          inputs = seg_proc(
              images=[person_image], return_tensors="pt",
          ).to("cuda")
          with torch.no_grad():
              logits = seg_model(**inputs).logits
          p_h, p_w = person_image.size[1], person_image.size[0]
          up = F.interpolate(
              logits, size=(p_h, p_w),
              mode="bilinear", align_corners=False,
          )
          person_seg = up.argmax(dim=1).cpu().numpy()[0]

          # Upper clothes (4) = torso region
          torso_mask = (person_seg == 4)
          torso_rows = np.where(torso_mask.any(axis=1))[0]

          if len(torso_rows) == 0:
              print("WARNING: No upper-clothes detected.")
              print("  Using middle 25-65% as torso estimate.")
              TORSO_TOP = int(p_h * 0.25)
              TORSO_BOT = int(p_h * 0.65)
          else:
              TORSO_TOP = int(torso_rows[0])
              TORSO_BOT = int(torso_rows[-1])

          print(f"Torso region: rows {TORSO_TOP}-{TORSO_BOT} "
                f"({TORSO_BOT - TORSO_TOP}px, "
                f"{(TORSO_BOT - TORSO_TOP)/p_h*100:.0f}%)")

          # 2. Define warp function
          def warp_torso(img_np, scale_x, fade_px=FADE_PX):
              """Horizontally scale torso region.
              Smooth vertical fade at torso boundaries.
              """
              if scale_x <= 1.0:
                  return img_np.copy()

              h, w = img_np.shape[:2]
              cx = w / 2.0

              ys = np.arange(h, dtype=np.float32)
              xs = np.arange(w, dtype=np.float32)
              map_x, map_y = np.meshgrid(xs, ys)

              # Vertical blend: smooth fade at edges
              blend = np.zeros(h, dtype=np.float32)
              t1 = TORSO_TOP
              t2 = min(TORSO_TOP + fade_px, TORSO_BOT)
              b1 = max(TORSO_BOT - fade_px, TORSO_TOP)
              b2 = TORSO_BOT

              top_fade = (ys >= t1) & (ys < t2)
              mid_zone = (ys >= t2) & (ys <= b1)
              bot_fade = (ys > b1) & (ys <= b2)

              if t2 > t1:
                  blend[top_fade] = (
                      (ys[top_fade] - t1) / (t2 - t1)
                  )
              blend[mid_zone] = 1.0
              if b2 > b1:
                  blend[bot_fade] = (
                      (b2 - ys[bot_fade]) / (b2 - b1)
                  )

              # Inverse horizontal mapping
              inv_s = 1.0 / scale_x
              blend_2d = blend[:, np.newaxis]
              dx = map_x - cx
              map_x = cx + dx * (
                  inv_s * blend_2d + 1.0 * (1 - blend_2d)
              )

              return cv2.remap(
                  img_np, map_x, map_y,
                  cv2.INTER_LINEAR,
                  borderMode=cv2.BORDER_REFLECT_101,
              )

          # 3. Preview warped persons
          person_np = np.array(person_image)
          WARPED_PERSONS = {}

          cell_h, cell_w = 400, 300
          preview = Image.new(
              "RGB",
              (cell_w * 4 + 50, cell_h + 30),
              (255, 255, 255),
          )
          draw = ImageDraw.Draw(preview)

          for i, (size, scale) in enumerate(
              TORSO_SCALE.items()
          ):
              warped = warp_torso(person_np, scale)
              WARPED_PERSONS[size] = Image.fromarray(warped)

              thumb = Image.fromarray(warped).resize(
                  (cell_w, cell_h), Image.LANCZOS,
              )
              x = 10 + i * (cell_w + 10)
              draw.text(
                  (x + 5, 3),
                  f"{size} (x{scale})",
                  fill=(0, 0, 0),
              )
              preview.paste(thumb, (x, 30))
              print(f"  {size}: scale={scale}x")

          display(preview)
          print("Person torso warp preview ready.")
          print("Verify: torso gets wider M -> 2XL, "
                "head/legs unchanged.")

