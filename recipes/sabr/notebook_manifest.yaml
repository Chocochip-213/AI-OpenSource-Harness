- name: cell-28
  type: code
  source: "#@title G2) Kill current inference + trim all videos to 15s { run: \"auto\" }\n# 1) Stop any\
    \ running inference child process (frees GPU + stops log spam)\n# 2) Trim every mp4 in videos/ to\
    \ first 15s (re-encode for clean keyframe)\n# 3) Reset _inf so poll cells don't show stale state\n\
    import subprocess, os, time, signal, re\nfrom pathlib import Path\n\n# [1] Kill inference.py processes\
    \ (any still running)\nr = subprocess.run(['pgrep', '-f', 'inference.py|video_inpainting'],\n    \
    \               capture_output=True, text=True)\npids = [p for p in r.stdout.strip().split('\\n')\
    \ if p.isdigit()]\nfor pid in pids:\n    try:\n        os.kill(int(pid), signal.SIGTERM)\n       \
    \ print(f\"  SIGTERM -> pid {pid}\")\n    except ProcessLookupError:\n        pass\ntime.sleep(2)\n\
    for pid in pids:\n    try:\n        os.kill(int(pid), signal.SIGKILL)  # force\n    except ProcessLookupError:\n\
    \        pass\nprint(f\"  killed {len(pids)} process(es)\")\n\n# [2] Trim videos\nVIDEOS = Path('/root/virtual-avatar-generation/videos')\n\
    for mp4 in list(VIDEOS.glob('*.mp4')):\n    if mp4.name.endswith('.15s.mp4'):\n        continue  #\
    \ already trimmed\n    # Get duration\n    r = subprocess.run(['ffprobe', '-v', 'error', '-show_entries',\
    \ 'format=duration',\n                        '-of', 'default=noprint_wrappers=1:nokey=1', str(mp4)],\n\
    \                       capture_output=True, text=True)\n    try:\n        dur = float(r.stdout.strip())\n\
    \    except ValueError:\n        print(f\"  SKIP: {mp4.name} - cannot read duration\")\n        continue\n\
    \    print(f\"  {mp4.name}: {dur:.1f}s\", end='')\n    if dur <= 15.5:\n        print(\" -> keep as-is\"\
    )\n        continue\n    # Trim to 15s, re-encode for clean keyframes (libx264 fast preset)\n    trimmed\
    \ = mp4.with_suffix('.15s.mp4')\n    r = subprocess.run(['ffmpeg', '-y', '-i', str(mp4), '-t', '15',\n\
    \                        '-c:v', 'libx264', '-preset', 'fast', '-crf', '23',\n                   \
    \     '-an',  # drop audio (SABR doesn't use it)\n                        str(trimmed)], capture_output=True,\
    \ text=True)\n    if r.returncode != 0:\n        print(f\" FAIL: {r.stderr[-200:]}\")\n        continue\n\
    \    # Replace original with trimmed (keep same name so inference.py listdir picks it up)\n    mp4.unlink()\n\
    \    trimmed.rename(mp4)\n    new_dur = subprocess.run(['ffprobe', '-v', 'error', '-show_entries',\
    \ 'format=duration',\n                              '-of', 'default=noprint_wrappers=1:nokey=1', str(mp4)],\n\
    \                             capture_output=True, text=True).stdout.strip()\n    print(f\" -> trimmed\
    \ to {new_dur}s, {mp4.stat().st_size // 1024} KB\")\n\n# [3] Reset inference state\nif '_inf' in dir():\n\
    \    _inf.clear()\n    _inf.update({'status': 'reset', 'rc': None})\nprint(\"\\n  _inf reset. Ready\
    \ to re-run Cell H.\")\nprint(\"\\n[G2] PASS.\")"
  cell_id: 24V-_ekvbXKh
