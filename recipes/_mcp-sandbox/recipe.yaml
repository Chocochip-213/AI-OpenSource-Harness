name: _mcp-sandbox
version: 0.1.0
description: Phase 2 sandbox recipe — the smallest thing that proves Claude → colab-mcp
  → live Colab works end-to-end. Not a real model port.
recipe_type: colab-notebook
upstream:
  repo: https://github.com/pytorch/pytorch.git
  ref: main
requirements: requirements_opt1.txt
main: run.sh
notebook_manifest: notebook_manifest.yaml
docs:
  plan: docs/plan.md
  context: docs/context.md
  tasks: docs/tasks.md
runtime:
  gpu: T4
  python: '3.11'
  disk_gb: 10
  vram_min_gb: 8
  colab_version: '2025.07'
secrets:
  required: []
  optional: []
strategy_history:
- version: v1
  name: Direct pip (sandbox)
  status: untested
  reason: minimum surface — imports torch from Colab stock, no extras
  date: 2026-04-20
artifacts:
  notebook: outputs/notebooks/{name}.ipynb
  e2e_results: outputs/e2e/{name}/
  mcp_sessions: outputs/mcp-sessions/{name}/
mcp:
  enabled: false
  allow_auto_execution: false
  max_tool_output_tokens: 5000
  preferred_gpu: T4
  keepalive: false
  timeout_seconds: 120
  serve_via_gradio: false
