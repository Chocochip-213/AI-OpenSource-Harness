name: flux2-tpose
version: "0.1.0"
description: >
  FLUX.2 Klein 9B Garment T-pose Conversion.
  Converts garment photos (flat-lay, hanger, worn) to T-pose front-view
  images for downstream 3D mesh generation. Gradio API endpoint on Colab.

model:
  base: black-forest-labs/FLUX.2-klein-9B
  text_encoder: Qwen3 (sentencepiece)

runtime:
  gpu: Blackwell 102GB / A100 80GB
  vram_estimate: ~29GB (bf16), full GPU at 40GB+
  precision: bfloat16

requirements: requirements_opt1.txt

main: run.sh

notebook_manifest: notebook_manifest.yaml

docs:
  plan: docs/plan.md
  context: docs/context.md
  tasks: docs/tasks.md
