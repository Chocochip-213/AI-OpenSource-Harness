- name: cell-14
  type: code
  source: "#@title F) Context-skip patch for inference.py { run: \"auto\" }\n# Adds --skipContext CLI\
    \ flag + skip_context branches in RunPipeline. 6 anchors +\n# weights_only=False. Idempotent via '--skipContext'\
    \ presence check.\nfrom pathlib import Path\ninf_py = Path('/root/virtual-avatar-generation/inference.py')\n\
    src = inf_py.read_text()\n\nif '--skipContext' in src:\n    print(\"  Already patched — skipping\"\
    )\nelse:\n    # P4a: argparse flag\n    anchor_a = \"parser.add_argument('--videoDir'\"\n    assert\
    \ anchor_a in src, f\"FAIL: anchor_a not found\"\n    src = src.replace(anchor_a,\n        \"parser.add_argument('--skipContext',\
    \ action='store_true',\\n                        help='Skip context model (40GB path; README FAQ).')\\\
    n    \" + anchor_a, 1)\n\n    # P4b: pass skip_context to RunPipeline\n    anchor_b = \"pipeline =\
    \ RunPipeline(video_name, videoDir, ckpt, args.mode)\"\n    assert anchor_b in src, f\"FAIL: anchor_b\
    \ not found\"\n    src = src.replace(anchor_b,\n        \"pipeline = RunPipeline(video_name, videoDir,\
    \ ckpt, args.mode, skip_context=args.skipContext)\", 1)\n\n    # P4c: __init__ signature + attribute\n\
    \    anchor_c = \"def __init__(self, video_name, video_dir, ckpt, mode):\"\n    assert anchor_c in\
    \ src, f\"FAIL: anchor_c not found\"\n    src = src.replace(anchor_c,\n        \"def __init__(self,\
    \ video_name, video_dir, ckpt, mode, skip_context=False):\", 1)\n    anchor_c2 = \"self.checkpoint\
    \ = ckpt\"\n    assert anchor_c2 in src, f\"FAIL: anchor_c2 not found\"\n    src = src.replace(anchor_c2,\n\
    \        \"self.checkpoint = ckpt\\n        self.skip_context = skip_context\", 1)\n\n    # P4d: guard\
    \ context subprocess in inpaint_person()\n    anchor_d = \"subprocess.run(getContextFrames, cwd=self.context_tool_dir,\
    \ check=True)\"\n    assert anchor_d in src, f\"FAIL: anchor_d not found\"\n    src = src.replace(anchor_d,\n\
    \        \"if not self.skip_context:\\n            \" + anchor_d + \"\\n\"\n        \"        else:\\\
    n\"\n        \"            print('[skipContext] skipping GroundingDINO+AOT context extraction')\"\
    , 1)\n\n    # P4d2: guard L382-L386 block (single-arg getFrameTensors + initLength + rmtree)\n   \
    \ anchor_d2 = 'context_tensor = self.getFrameTensors(contextFrames_path)\\n        self.initLength\
    \ = context_tensor.shape[0]\\n        print(f\"Length of context is {self.initLength}\")\\n      \
    \  shutil.rmtree(contextFrames_path)'\n    assert anchor_d2 in src, f\"FAIL: anchor_d2 block not found\"\
    \n    src = src.replace(anchor_d2,\n        \"if self.skip_context:\\n\"\n        \"            self.initLength\
    \ = 0\\n\"\n        \"            print('[skipContext] skipping early context frame read; initLength=0')\\\
    n\"\n        \"        else:\\n\"\n        \"            context_tensor = self.getFrameTensors(contextFrames_path)\\\
    n\"\n        \"            self.initLength = context_tensor.shape[0]\\n\"\n        \"            print(f\\\
    \"Length of context is {self.initLength}\\\")\\n\"\n        \"            shutil.rmtree(contextFrames_path)\"\
    , 1)\n\n    # P4e: fabricate zero context tensor\n    anchor_e = \"context_tensor = self.getFrameTensors(contextFrames_path,\
    \ context_image_files, newH, newW, self.device)\"\n    assert anchor_e in src, f\"FAIL: anchor_e not\
    \ found\"\n    src = src.replace(anchor_e,\n        \"if self.skip_context:\\n\"\n        \"     \
    \       context_tensor = torch.zeros(1, 3, newH, newW, device=self.device)\\n\"\n        \"      \
    \  else:\\n\"\n        \"            \" + anchor_e, 1)\n\n    # P4f: skip context_image_files listdir\n\
    \    anchor_f = \"context_image_files = os.listdir(contextFrames_path)\"\n    assert anchor_f in src,\
    \ f\"FAIL: anchor_f not found\"\n    src = src.replace(anchor_f,\n        \"if self.skip_context:\\\
    n\"\n        \"            context_image_files = []\\n\"\n        \"        else:\\n\"\n        \"\
    \            \" + anchor_f, 1)\n\n    # P5: weights_only=False on torch.load (PyTorch 2.6+ safety\
    \ default blocks dict ckpt)\n    anchor_p5 = \"self.checkpoint = torch.load(self.checkpoint, map_location=self.device)\"\
    \n    if anchor_p5 in src:\n        src = src.replace(anchor_p5,\n            \"self.checkpoint =\
    \ torch.load(self.checkpoint, map_location=self.device, weights_only=False)\", 1)\n        print(\"\
    \  P5 applied: weights_only=False\")\n\n    inf_py.write_text(src)\n    print(\"  Patches P4a-P4f\
    \ + P5 applied.\")\n\n# Verify\nfinal = inf_py.read_text()\nfor tok in ['--skipContext', 'skip_context=False',\n\
    \            'if self.skip_context:', 'initLength = 0']:\n    assert tok in final, f\"FAIL verification:\
    \ '{tok}' missing\"\nprint(\"\\n[F] PASS — all F verification tokens present.\")\n\n# Quick py-syntax\
    \ sanity via mamba run python -c compile\nimport subprocess\nr = subprocess.run(['mamba', 'run', '-n',\
    \ 'sabr', '--no-capture-output',\n                    'python', '-c',\n                    'import\
    \ py_compile; py_compile.compile(\"/root/virtual-avatar-generation/inference.py\", doraise=True);\
    \ print(\"compile OK\")'],\n                   capture_output=True, text=True)\nprint(\"  syntax:\"\
    , r.stdout.strip() or r.stderr.strip()[-400:])"
