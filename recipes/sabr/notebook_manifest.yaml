  type: code
  source: "#@title Hp) Poll inference progress { run: \"auto\" }\nimport time, subprocess\nfrom pathlib\
    \ import Path\nlog = Path('/tmp/sabr_inf.log')\nelapsed = (time.time() - _inf['started_at']) / 60\
    \ if '_inf' in dir() else 0\nprint(f\"Status: {_inf.get('status')}  rc: {_inf.get('rc')}  Elapsed:\
    \ {elapsed:.1f} min\")\nif log.exists():\n    n = sum(1 for _ in open(log))\n    print(f\"Log: {log.stat().st_size\
    \ // 1024} KB, {n} lines\\n\")\n    r = subprocess.run(['tail', '-n', '30', str(log)], capture_output=True,\
    \ text=True)\n    print(r.stdout)\n# Output file check\nout = sorted(Path('/root/virtual-avatar-generation/output').glob('*.mp4'))\n\
    print(f\"\\noutput/ mp4 count: {len(out)}\")\nfor m in out:\n    print(f\"  {m.name}: {m.stat().st_size\
    \ / (1024**2):.2f} MB\")\nif _inf.get('status') == 'done':\n    rc = _inf['rc']\n    print(f\"\\n===\
    \ INFERENCE {'COMPLETE' if rc==0 else 'FAILED'} rc={rc} ===\")\nelse:\n    print(\"\\n(still running)\"\
    )"
