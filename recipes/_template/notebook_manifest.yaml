      #@title C) Verify Dependencies { run: "auto" }
      # Fail-fast: catch missing deps NOW, not 30 min later during inference
      import sys
      REQUIRED = {
          # "torch": lambda: __import__("torch").cuda.is_available(),
          # "transformers": lambda: __import__("transformers"),
      }
      failed = []
      for name, check in REQUIRED.items():
          try:
              check()
              print(f"  {name}: OK")
          except Exception as e:
              print(f"  {name}: FAIL - {e}")
              failed.append(name)
      if failed:
          print(f"\nFATAL: {len(failed)} package(s) missing: {', '.join(failed)}")
          sys.exit(1)
      else:
          print(f"All {len(REQUIRED)} dependencies verified.")

