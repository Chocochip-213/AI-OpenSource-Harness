- name: cell-13
  type: code
  source: "#@title E) PHALP URL patch + SMPL convert + CACHE_DIR { run: \"auto\" }\nimport os, subprocess,\
    \ sys, textwrap\nfrom pathlib import Path\nos.chdir('/root/virtual-avatar-generation')\n\n# P1: Berkeley\
    \ -> UT Austin in pipeline/context/model.py\nmodel_py = Path('pipeline/context/model.py')\nbefore\
    \ = model_py.read_text()\nafter = before.replace('people.eecs.berkeley.edu/~jathushan', 'www.cs.utexas.edu/~pavlakos')\n\
    if before == after:\n    count = subprocess.run(['grep', '-c', 'pavlakos', str(model_py)],\n     \
    \                      capture_output=True, text=True).stdout.strip()\n    print(f\"  P1 already patched\
    \ ({count} pavlakos refs)\")\nelse:\n    model_py.write_text(after)\n    count = subprocess.run(['grep',\
    \ '-c', 'pavlakos', str(model_py)],\n                           capture_output=True, text=True).stdout.strip()\n\
    \    print(f\"  P1 PASS: Berkeley -> UT Austin ({count} refs)\")\n\n# P2: basicModel chumpy pkl ->\
    \ SMPL_NEUTRAL.pkl (Py3 clean)\n# Must run INSIDE sabr env because unpickling needs chumpy module.\n\
    convert_script = textwrap.dedent(\"\"\"\n    import pickle, os, numpy as np\n    src = os.path.expanduser('~/virtual-avatar-generation/pipeline/track/data/basicModel_neutral_lbs_10_207_0_v1.0.0.pkl')\n\
    \    dst = os.path.expanduser('~/.cache/phalp/3D/models/smpl/SMPL_NEUTRAL.pkl')\n    os.makedirs(os.path.dirname(dst),\
    \ exist_ok=True)\n    if os.path.exists(dst) and os.path.getsize(dst) > 30_000_000:\n        print(f'\
    \  P2 already converted: {dst}')\n    else:\n        with open(src, 'rb') as f:\n            d = pickle.load(f,\
    \ encoding='latin1')\n        converted = 0\n        for k, v in list(d.items()):\n            if\
    \ 'chumpy' in str(type(v)).lower():\n                d[k] = np.array(v)\n                converted\
    \ += 1\n        with open(dst, 'wb') as f:\n            pickle.dump(d, f, protocol=2)\n        print(f'\
    \  P2 PASS: {dst} ({os.path.getsize(dst)} bytes, {converted} chumpy -> ndarray)')\n\"\"\")\nr = subprocess.run(\n\
    \    ['mamba', 'run', '-n', 'sabr', '--no-capture-output',\n     'python', '-c', convert_script],\n\
    \    capture_output=True, text=True)\nprint(r.stdout)\nif r.stderr and 'Error' in r.stderr:\n    print('\
    \  stderr:', r.stderr[-600:])\n\n# P3: PHALP weight renames into CACHE_DIR\nsrc_dir = Path('pipeline/context/phalp_weights')\n\
    cache_wts = Path('/root/.cache/phalp/weights')\ncache_wts.mkdir(parents=True, exist_ok=True)\nRENAMES\
    \ = [\n    (src_dir / 'hmar_v2_weights.pth',        cache_wts / 'hmar_v2_weights.pth'),\n    (src_dir\
    \ / 'pose_predictor_40006.ckpt',  cache_wts / 'pose_predictor.pth'),\n    (src_dir / 'config_40006.yaml',\
    \          cache_wts / 'pose_predictor.yaml'),\n]\nfor s, d in RENAMES:\n    if d.exists() and d.stat().st_size\
    \ == s.stat().st_size:\n        print(f\"  P3 skip: {d.name}\")\n        continue\n    subprocess.run(['cp',\
    \ str(s), str(d)], check=True)\n    print(f\"  P3 PASS: {s.name} -> {d}\")\n\ncache_3d = Path('/root/.cache/phalp/3D')\n\
    for f in ['SMPL_to_J19.pkl', 'texture.npz', 'head_faces.npy',\n          'smpl_mean_params.npz', 'mean_std.npy']:\n\
    \    s = src_dir / '3D' / f\n    d = cache_3d / f\n    if d.exists() and d.stat().st_size == s.stat().st_size:\n\
    \        continue\n    subprocess.run(['cp', str(s), str(d)], check=True)\nprint(f\"  P3 3D aux: 5\
    \ files at {cache_3d}\")\n\n# Summary\nprint(\"\\n  CACHE_DIR final state:\")\nfor p in sorted(Path('/root/.cache/phalp').rglob('*')):\n\
    \    if p.is_file():\n        sz = p.stat().st_size\n        print(f\"    {sz:>12}  {p.relative_to('/root/.cache/phalp')}\"\
    )\nprint(\"\\n[E] PASS.\")"
