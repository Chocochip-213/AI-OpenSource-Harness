- name: cell-12
  type: code
  source: "#@title D5) chumpy patch + ultralytics fix + flash_attn shim (sync, fast) { run: \"auto\" }\n\
    # This one is fast (no heavy pips) so run sync.\nimport subprocess, os\nfrom pathlib import Path\n\
    \nSABR_SP = '/usr/local/envs/sabr/lib/python3.10/site-packages'\n\n# [1] Patch chumpy __init__.py\
    \ — line 11 imports np aliases removed in numpy 2.x\nchumpy_init = Path(SABR_SP) / 'chumpy' / '__init__.py'\n\
    src = chumpy_init.read_text()\nbad_line = 'from numpy import bool, int, float, complex, object, unicode,\
    \ str, nan, inf'\nif bad_line in src:\n    new_block = \"\"\"# [2026-04-21 patch] numpy 2.x removed\
    \ these aliases. Replace with Python builtins + nan/inf.\nfrom numpy import nan, inf\nbool = bool\n\
    int = int\nfloat = float\ncomplex = complex\nobject = object\nstr = str\nunicode = str\"\"\"\n   \
    \ src = src.replace(bad_line, new_block)\n    chumpy_init.write_text(src)\n    print(\"  [1] chumpy\
    \ __init__.py patched for numpy 2.x\")\nelse:\n    print(\"  [1] chumpy already patched (or different\
    \ version)\")\n\n# Verify chumpy imports cleanly now\nr = subprocess.run(\n    ['mamba', 'run', '-n',\
    \ 'sabr', '--no-capture-output',\n     'python', '-c', 'import chumpy; print(\"chumpy:\", chumpy.__version__\
    \ if hasattr(chumpy,\"__version__\") else \"0.70\")'],\n    capture_output=True, text=True)\nprint(\"\
    \  chumpy import:\", r.stdout.strip() or r.stderr.strip()[:200])\n\n# [2] Ultralytics matplotlib backend\
    \ fix — set MPLBACKEND=Agg globally\n# The error comes from matplotlib trying to use Colab inline\
    \ backend inside sabr env\n# where matplotlib_inline package isn't installed. Force Agg backend via\
    \ matplotlibrc.\nmpl_cfg_dir = Path(SABR_SP) / 'matplotlib' / 'mpl-data'\nif mpl_cfg_dir.exists():\n\
    \    matplotlibrc = mpl_cfg_dir / 'matplotlibrc'\n    mrc = matplotlibrc.read_text()\n    if 'backend:\
    \ Agg' not in mrc:\n        # Replace or append backend line\n        import re as _re\n        mrc2\
    \ = _re.sub(r'^(#\\s*)?backend\\s*:\\s*.*$', 'backend: Agg', mrc, count=1, flags=_re.MULTILINE)\n\
    \        if 'backend: Agg' not in mrc2:\n            mrc2 = 'backend: Agg\\n' + mrc\n        matplotlibrc.write_text(mrc2)\n\
    \        print(\"  [2] matplotlibrc backend -> Agg\")\n    else:\n        print(\"  [2] matplotlibrc\
    \ backend already Agg\")\nelse:\n    print(f\"  [2] SKIP — matplotlib mpl-data not at {mpl_cfg_dir}\"\
    )\n\n# Verify ultralytics imports cleanly\nr = subprocess.run(\n    ['mamba', 'run', '-n', 'sabr',\
    \ '--no-capture-output',\n     'python', '-c', 'import os; os.environ[\"MPLBACKEND\"]=\"Agg\"; import\
    \ ultralytics; print(\"ultralytics:\", ultralytics.__version__)'],\n    capture_output=True, text=True)\n\
    print(\"  ultralytics import:\", r.stdout.strip() or r.stderr.strip()[-200:])\n\n# [3] flash_attn\
    \ stub — install.sh requires it, DiT may import it.\n# Create a minimal stub that falls through to\
    \ F.scaled_dot_product_attention (SDPA).\n# sm_80 A100 supports SDPA natively in torch 2.x with math\
    \ kernel.\nflash_stub_dir = Path(SABR_SP) / 'flash_attn'\nflash_stub_dir.mkdir(exist_ok=True)\n(flash_stub_dir\
    \ / '__init__.py').write_text('''# 2026-04-21 stub — flash_attn build failed, use torch SDPA.\n__version__\
    \ = \"2.5.8-stub\"\nimport warnings, torch\nimport torch.nn.functional as F\n\ndef flash_attn_func(q,\
    \ k, v, dropout_p=0.0, softmax_scale=None, causal=False, **kwargs):\n    \"\"\"Stub: route to torch\
    \ SDPA. Layouts: (B, S, H, D) for q/k/v.\"\"\"\n    # flash-attn uses (B, S, H, D); SDPA expects (B,\
    \ H, S, D)\n    q = q.transpose(1, 2); k = k.transpose(1, 2); v = v.transpose(1, 2)\n    out = F.scaled_dot_product_attention(q,\
    \ k, v, dropout_p=dropout_p,\n                                          is_causal=causal, scale=softmax_scale)\n\
    \    return out.transpose(1, 2)\n\ndef flash_attn_varlen_func(*args, **kwargs):\n    raise NotImplementedError(\"\
    flash_attn_varlen_func not stubbed — check if DiT needs it\")\n''')\n# Also create .dist-info so importlib.metadata.version()\
    \ works\ndist_info = Path(SABR_SP) / 'flash_attn-2.5.8.dist-info'\ndist_info.mkdir(exist_ok=True)\n\
    (dist_info / 'METADATA').write_text('Metadata-Version: 2.1\\nName: flash-attn\\nVersion: 2.5.8\\n')\n\
    (dist_info / 'RECORD').write_text('')\nprint(\"  [3] flash_attn stub installed at\", flash_stub_dir)\n\
    \nr = subprocess.run(\n    ['mamba', 'run', '-n', 'sabr', '--no-capture-output',\n     'python', '-c',\
    \ 'import flash_attn; print(\"flash_attn:\", flash_attn.__version__)'],\n    capture_output=True,\
    \ text=True)\nprint(\"  flash_attn import:\", r.stdout.strip() or r.stderr.strip()[-200:])\n\nprint(\"\
    \\n[D5] PASS.\")"
