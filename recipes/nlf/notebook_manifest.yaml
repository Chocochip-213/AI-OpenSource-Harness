      #@title H) FastAPI v0.3 — body-shape embedding server (background) { run: "auto" }
      # 핵심 통찰: rigid bones / Y_span = rigid bones / real_height (H factor cancels in ratio).
      # → 클라가 키 몰라도 비교 가능한 dimensionless body-shape vector.
      import threading, time, io
      import torch, torchvision, numpy as np
      from PIL import Image
      from fastapi import FastAPI, UploadFile, File
      from typing import List
      import uvicorn

      assert "model" in globals(), "Run cell E first"

      FEATURE_NAMES = ['shoulder_w_norm','hip_w_norm','torso_norm',
                       'upper_arm_norm','forearm_norm','thigh_norm','shin_norm']

      def rigid_proportions(j):
          """Y-span 정규화. RIGID bone segments only — pose-invariant + height-invariant.
          float() wrap 필수: numpy.float32는 FastAPI jsonable_encoder가 직렬화 못 함
          (TypeError: 'numpy.float32' object is not iterable)."""
          Y = float(j[:,1].max() - j[:,1].min())
          return [
              float(abs(j[16,0]-j[17,0])/Y),                                                   # shoulder_w
              float(abs(j[1,0] -j[2,0]) /Y),                                                   # hip_w (V-taper)
              float(abs(j[12,1]-j[0,1]) /Y),                                                   # torso
              float((np.linalg.norm(j[16]-j[18]) + np.linalg.norm(j[17]-j[19]))/2/Y),         # upper_arm
              float((np.linalg.norm(j[18]-j[20]) + np.linalg.norm(j[19]-j[21]))/2/Y),         # forearm
              float((np.linalg.norm(j[1]-j[4])  + np.linalg.norm(j[2]-j[5])) /2/Y),           # thigh
              float((np.linalg.norm(j[4]-j[7])  + np.linalg.norm(j[5]-j[8])) /2/Y),           # shin
          ]

      def _decode(raw):
          # torchvision.io.decode_image — 셀 F의 read_image가 내부적으로 사용하는 경로 (검증됨).
          # bytearray(raw) → writable buffer 보장 (torch.frombuffer가 immutable bytes에 약한 torch 2.10 우회).
          # PIL→numpy→permute 체인은 numpy 2.x non-writeable 이슈 + 비표준 stride로 SMPL TorchScript에서 500.
          raw_t = torch.frombuffer(bytearray(raw), dtype=torch.uint8)
          return torchvision.io.decode_image(raw_t, mode=torchvision.io.ImageReadMode.RGB).to("cuda")

      def _run(raw):
          img = _decode(raw)
          with torch.inference_mode(), torch.device("cuda"):
              pred = model.detect_smpl_batched(img.unsqueeze(0))
          return img, pred

      def _main_idx(pred):
          """가장 큰 bbox = 메인 피사체 (셀카에 작은 보조 검출 회피)."""
          b = pred["boxes"][0]
          if b.shape[0] == 0: return None
          areas = (b[:,2]-b[:,0]) * (b[:,3]-b[:,1])
          return int(areas.argmax())

      app = FastAPI(title="NLF Body Embedding API", version="0.3.0",
                    description="Single image → 7-dim pose-invariant body-shape vector. "
                                "Sárándi+Pons-Moll NeurIPS'24 (Neural Localizer Fields).")

      @app.get("/")
      def root():
          return {
              "name": "NLF Body Embedding API", "version": "0.3.0",
              "primary": "POST /embed (single image) → 7-dim body-shape vector",
              "use_case": "signup → embed → store vector → client computes similarity later",
              "feature_names": FEATURE_NAMES,
              "endpoints": {
                  "POST /embed":   "image → 7-dim vector (PRIMARY signup endpoint)",
                  "POST /infer":   "image → full SMPL params + vector",
                  "POST /compare": "N images → pairwise body-shape distance",
                  "GET /health":   "liveness + GPU status",
                  "GET /docs":     "Swagger UI",
              },
          }

      @app.get("/health")
      def health():
          return {"status":"ok", "model_loaded": True,
                  "torch": torch.__version__,
                  "gpu": torch.cuda.get_device_name(0),
                  "vram_gb_free": round(torch.cuda.mem_get_info()[0]/1e9, 2),
                  "vram_gb_total": round(torch.cuda.mem_get_info()[1]/1e9, 2)}

      @app.post("/embed")
      async def embed(file: UploadFile = File(...)):
          """PRIMARY: 가입 시 1번 호출. 저장 후 클라가 자체 L2/cosine 비교."""
          raw = await file.read()
          _, pred = _run(raw)
          idx = _main_idx(pred)
          if idx is None:
              return {"ok": False, "error": "no person detected", "n_persons": 0}
          j3d = pred["joints3d"][0][idx].detach().cpu().numpy()
          return {
              "ok": True,
              "vector": rigid_proportions(j3d),
              "feature_names": FEATURE_NAMES, "dim": 7,
              "n_persons_detected": int(pred["boxes"][0].shape[0]),
              "subject_idx": idx,
              "pose_invariant": True, "height_invariant": True,
              "model": "NLF Sárándi+Pons-Moll NeurIPS'24",
          }

      def _person_payload(pred, idx):
          j3d = pred["joints3d"][0][idx].detach().cpu().numpy()
          return {
              "boxes":  pred["boxes"][0][idx].detach().cpu().numpy().tolist(),
              "betas":  pred["betas"][0][idx].detach().cpu().numpy().tolist(),
              "pose":   pred["pose"][0][idx].detach().cpu().numpy().tolist(),
              "trans":  pred["trans"][0][idx].detach().cpu().numpy().tolist(),
              "joints3d": j3d.tolist(),
              "joints2d": pred["joints2d"][0][idx].detach().cpu().numpy().tolist(),
              "joint_uncertainties": pred["joint_uncertainties"][0][idx].detach().cpu().numpy().tolist(),
              "rigid_proportions_vector": rigid_proportions(j3d),
          }

      @app.post("/infer")
      async def infer(file: UploadFile = File(...)):
          raw = await file.read()
          img, pred = _run(raw)
          n = int(pred["boxes"][0].shape[0])
          return {"n_persons": n, "image_shape": list(img.shape), "filename": file.filename,
                  "persons": [_person_payload(pred, i) for i in range(n)]}

      @app.post("/compare")
      async def compare(files: List[UploadFile] = File(...)):
          if len(files) < 2: return {"error": "need >=2 files"}
          items = []
          for f in files:
              raw = await f.read()
              _, pred = _run(raw)
              idx = _main_idx(pred)
              if idx is None:
                  items.append({"filename": f.filename, "vector": None})
              else:
                  j3d = pred["joints3d"][0][idx].detach().cpu().numpy()
                  items.append({"filename": f.filename, "vector": rigid_proportions(j3d)})
          pairs = []
          for i in range(len(items)):
              for j in range(i+1, len(items)):
                  v1, v2 = items[i]["vector"], items[j]["vector"]
                  d = None if (v1 is None or v2 is None) else float(np.linalg.norm(np.array(v1)-np.array(v2)))
                  pairs.append({"a": items[i]["filename"], "b": items[j]["filename"], "distance": d})
          return {"items": items, "pairs": pairs}

      PORT = 7860
      def _serve():
          uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="warning")

      _existing = globals().get('_nlf_server_thread')
      if _existing is None or not _existing.is_alive():
          _nlf_server_thread = threading.Thread(target=_serve, daemon=True)
          _nlf_server_thread.start()
          time.sleep(2)
          print(f"[server] FastAPI v0.3 on :{PORT}")
      else:
          print(f"[server] already on :{PORT}")

      import requests
      print(f"[health] {requests.get(f'http://localhost:{PORT}/health', timeout=5).json()}")

