    )\nr = subprocess.run(\n    ['mamba', 'run', '-n', 'sabr', '--no-capture-output',\n     'pip', 'install',\
    \ '--no-cache-dir', '--force-reinstall', '--no-deps',\n     'numpy==1.26.4'],\n    capture_output=True,\
    \ text=True)\nprint('\\n'.join(r.stdout.splitlines()[-3:]))\n\n# [5] Verify import chain in sabr env\n\
    print(\"\\n  [5] Re-verify imports inside sabr env ...\")\nverify = textwrap.dedent(\"\"\"\n    import\
    \ os, sys, traceback\n    os.environ['HOME'] = '/root'\n    os.environ['MPLBACKEND'] = 'Agg'\n   \
    \ sys.path.insert(0, '/root/virtual-avatar-generation')\n    import numpy; print(f'  numpy: {numpy.__version__}')\n\
    \    for name in [\n        'phalp',\n        'flash_attn',\n        'model.architecture.diffusion_transformer',\n\
    \        'pipeline.track.phalp.utils.smpl_utils',\n    ]:\n        try:\n            __import__(name)\n\
    \            print(f'  [ok]    {name}')\n        except Exception as e:\n            print(f'  [FAIL]\
    \  {name} - {type(e).__name__}: {str(e)[:120]}')\n\"\"\")\nr = subprocess.run(\n    ['mamba', 'run',\
    \ '-n', 'sabr', '--no-capture-output', 'python', '-c', verify],\n    capture_output=True, text=True)\n\
