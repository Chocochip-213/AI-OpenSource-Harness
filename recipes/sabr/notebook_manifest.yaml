  type: code
  source: "#@title G) Input video upload { run: \"auto\" }\n# SABR rejects square videos (inference.py:408-410).\
    \ 5-10s recommended for first test.\nimport os, cv2, sys\nfrom pathlib import Path\n\nVIDEO_DIR =\
    \ Path('/root/virtual-avatar-generation/videos')\nVIDEO_DIR.mkdir(parents=True, exist_ok=True)\nos.chdir('/root/virtual-avatar-generation')\n\
    \ntry:\n    from google.colab import files\n    if not any(VIDEO_DIR.glob('*.mp4')):\n        print(\"\
    \  Upload a climbing video (mp4, NON-SQUARE, 5-10s recommended).\")\n        uploaded = files.upload()\n\
    \        for fname in uploaded:\n            dst = VIDEO_DIR / fname\n            dst.write_bytes(uploaded[fname])\n\
    \            print(f\"  Saved: {dst}\")\nexcept ImportError:\n    print(\"  (google.colab not available)\"\
    )\n\nclips = list(VIDEO_DIR.glob('*.mp4'))\nif not clips:\n    sys.exit(\"FATAL: no mp4 in videos/.\
    \ Upload one.\")\n\nfor clip in clips:\n    cap = cv2.VideoCapture(str(clip))\n    if not cap.isOpened():\n\
    \        sys.exit(f\"FATAL: cannot open {clip}\")\n    w = int(cap.get(cv2.CAP_PROP_FRAME_WIDTH))\n\
    \    h = int(cap.get(cv2.CAP_PROP_FRAME_HEIGHT))\n    fps = cap.get(cv2.CAP_PROP_FPS)\n    n_frames\
    \ = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))\n    cap.release()\n    duration = n_frames / fps if fps\
    \ else 0\n    print(f\"  {clip.name}: {w}x{h} @ {fps:.1f}fps, {n_frames} frames, {duration:.1f}s\"\
    )\n    if w == h:\n        sys.exit(f\"FATAL: {clip.name} is square ({w}x{h}). SABR latent mode rejects\
    \ square.\")\n    if duration > 15:\n        print(f\"  WARN: {duration:.1f}s is long — first test\
    \ should be <=10s\")\n\nprint(\"\\n[G] PASS - video ready.\")"
