- name: cell-70
  type: code
  source: "#@title Verify3) Visualize 3 output frames + compare to inpainted-only { run: \"auto\" }\n\
    import cv2, os, base64\nfrom pathlib import Path\nimport numpy as np\n\nVAG = Path(os.environ['HOME'])\
    \ / 'virtual-avatar-generation'\nout = VAG / 'output' / 'video.mp4'\ninpainted_only = VAG / 'pipeline'\
    \ / 'environment' / 'data' / 'results' / 'video.mp4'\n\ndef get_frame(p, frac):\n    cap = cv2.VideoCapture(str(p));\
    \ t = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))\n    cap.set(cv2.CAP_PROP_POS_FRAMES, int(t*frac))\n\
    \    ret, f = cap.read(); cap.release()\n    return f if ret else None\n\nprint(f\"Output: {out} exists={out.exists()}\"\
    )\nprint(f\"Inpainted-only: {inpainted_only} exists={inpainted_only.exists()}\")\n\n# Diff output\
    \ vs inpainted-only at same fractions — this is the acid test.\n# If they're >95% identical, avatar\
    \ was NOT rendered.\n# If they differ by 10-30% in person-region, avatar IS overlaid.\nif inpainted_only.exists():\n\
    \    for frac in [0.2, 0.5, 0.8]:\n        o = get_frame(out, frac)\n        i = get_frame(inpainted_only,\
    \ frac)\n        if o is None or i is None:\n            print(f\"  frac={frac}: missing frame\")\n\
    \            continue\n        if i.shape != o.shape:\n            i = cv2.resize(i, (o.shape[1],\
    \ o.shape[0]))\n        diff = np.abs(o.astype(np.int16) - i.astype(np.int16))\n        print(f\"\
    \  frac={frac}: out={o.shape} inp={i.shape}  mean_diff={diff.mean():.2f}  frac_px_changed>15: {(diff.mean(axis=2)>15).mean()*100:.1f}%\
    \  max_diff={diff.max()}\")\n\n# Save 3 output frames as small jpegs, print size so user can decide\
    \ if download-worth\nos.makedirs('/tmp/verify', exist_ok=True)\nfor i, frac in enumerate([0.2, 0.5,\
    \ 0.8]):\n    f = get_frame(out, frac)\n    if f is not None:\n        # Downsample to 400px wide\
    \ for inline display\n        h, w = f.shape[:2]\n        scale = 400 / w\n        small = cv2.resize(f,\
    \ (400, int(h*scale)))\n        cv2.imwrite(f'/tmp/verify/out_{i}.jpg', small, [cv2.IMWRITE_JPEG_QUALITY,\
    \ 70])\n        cv2.imwrite(f'/tmp/verify/out_full_{i}.jpg', f, [cv2.IMWRITE_JPEG_QUALITY, 80])\n\
    \        print(f\"  Saved /tmp/verify/out_{i}.jpg ({os.path.getsize(f'/tmp/verify/out_{i}.jpg')/1024:.1f}\
    \ KB)\")\n\n# Display inline so we can see it through MCP output\nfrom IPython.display import Image,\
    \ display\nfor i in range(3):\n    p = f'/tmp/verify/out_{i}.jpg'\n    if os.path.exists(p):\n   \
    \     print(f\"\\n=== Output frame at {int([0.2,0.5,0.8][i]*100)}% ===\")\n        display(Image(filename=p))\n"
