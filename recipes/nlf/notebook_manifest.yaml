      assert MODEL_PATH.stat().st_size == EXPECTED_BYTES, \
          f"size mismatch (bit.ly rotated?) — check https://github.com/isarandi/nlf/releases"
      print({"model_path": str(MODEL_PATH), "bytes": MODEL_PATH.stat().st_size})

