  type: code
  source: "#@title Verify2) Locate input + diff output vs input { run: \"auto\" }\nimport subprocess,\
    \ os, numpy as np, cv2\nfrom pathlib import Path\nHOME = os.environ['HOME']\nVAG = Path(HOME) / 'virtual-avatar-generation'\n\
    \n# Exhaustive search for input mp4/mov (excluding output/)\nr = subprocess.run(['find', str(VAG),\
    \ '-type', 'f', '(', '-name', '*.mp4', '-o', '-name', '*.mov', ')',\n                    '-not', '-path',\
    \ '*/output/*', '-not', '-path', '*/.cache/*'],\n                   capture_output=True, text=True,\
    \ timeout=30)\nall_vids = [Path(p) for p in r.stdout.strip().split('\\n') if p.strip()]\nprint(f\"\
    Candidate inputs: {len(all_vids)}\")\nfor p in sorted(all_vids, key=lambda x: x.stat().st_size, reverse=True)[:15]:\n\
    \    size_mb = p.stat().st_size / 1e6\n    print(f\"  {size_mb:7.2f} MB  {p}\")\n\n# Pick the largest\
    \ non-output video as likely source\nif all_vids:\n    inp = max(all_vids, key=lambda x: x.stat().st_size)\n\
    \    print(f\"\\nUsing: {inp}\")\n\n    out_vid = VAG / 'output' / 'video.mp4'\n\n    def sample_frames(vid_path,\
    \ n=5):\n        cap = cv2.VideoCapture(str(vid_path))\n        total = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))\n\
    \        fps = cap.get(cv2.CAP_PROP_FPS)\n        frames = []\n        for frac in [0.1, 0.3, 0.5,\
    \ 0.7, 0.9]:\n            cap.set(cv2.CAP_PROP_POS_FRAMES, int(total * frac))\n            ret, f\
    \ = cap.read()\n            if ret: frames.append((int(total*frac), f))\n        cap.release()\n \
    \       return frames, total, fps\n\n    of, ot, ofps = sample_frames(out_vid)\n    infr, it, ifps\
    \ = sample_frames(inp)\n    print(f\"Output: {ot} frames @ {ofps:.1f} fps\")\n    print(f\"Input:\
    \  {it} frames @ {ifps:.1f} fps\")\n\n    # Frame-by-frame diff. Output is 16:9 landscape 2504x1440\
    \ — input may differ.\n    print(\"\\nFrame diff (out vs input, same fractional position):\")\n  \
    \  for (ofn, oframe), (ifn, iframe) in zip(of, infr):\n        if iframe.shape[:2] != oframe.shape[:2]:\n\
    \            iframe_rs = cv2.resize(iframe, (oframe.shape[1], oframe.shape[0]))\n        else:\n \
    \           iframe_rs = iframe\n        diff = np.abs(oframe.astype(np.int16) - iframe_rs.astype(np.int16))\n\
    \        mean_diff = diff.mean()\n        # Also: what fraction of pixels changed by >30?\n      \
    \  changed_frac = (diff.mean(axis=2) > 30).mean()\n        print(f\"  frame~{ofn}: mean_abs_diff={mean_diff:5.2f}\
    \  frac_pixels_changed>30: {changed_frac*100:5.2f}%\")\n\n    # Save one frame for visual inspection\n\
    \    os.makedirs('/tmp/verify', exist_ok=True)\n    cv2.imwrite('/tmp/verify/out_mid.jpg', of[2][1])\n\
    \    cv2.imwrite('/tmp/verify/in_mid.jpg', infr[2][1])\n    print(\"\\nSaved /tmp/verify/{out_mid,in_mid}.jpg\
    \ for visual inspection\")\n    print(f\"Output mid frame size: {of[2][1].shape}  Input mid frame\
    \ size: {infr[2][1].shape}\")\n"
